<title>Listening Test 1 · Luke Murgatroyd</title>

<style>
/* Layout: answer-sheet app — sticky bar with part tabs; each part is one scrolling answer sheet laid out like the paper; review mode adds marks and the audioscript. */
:root{
  --bg:#F4F7FB; --surface:#FFFFFF; --ink:#152033; --muted:#566479; --line:#D9E1EB;
  --brand:#02437E; --brand-ink:#FFFFFF; --brand-soft:#E2EBF6;
  --good:#1B7443; --good-soft:#E1F2E8; --bad:#B42318; --bad-soft:#FBE7E5; --part:#9A5B00; --part-soft:#FFF1D6;
  --warn:#A45500; --mark:#FFE27A;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* sticky bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px}
.bar .ttl{flex:1;min-width:0}
.bar .ttl span{display:block;font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.bar .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;padding:6px 10px;border-radius:8px;background:var(--brand-soft);color:var(--brand);min-width:72px;text-align:center}
.timer.warn{color:var(--warn)} .timer.crit{background:var(--bad-soft);color:var(--bad)}
.tabs{max-width:880px;margin:0 auto;display:flex;gap:6px;padding-block:0 10px}
.tab{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.tab b{font-size:14px}
.tab span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tab[aria-selected="true"] span{color:var(--brand-ink);opacity:.85}

main{max-width:880px;margin:0 auto;padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.sheet{display:flex;flex-direction:column;gap:18px}
.parthead{display:flex;flex-direction:column;gap:2px}
.parthead .kick{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.parthead h1{font-family:var(--f-read);font-weight:600;font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qs{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--brand)}
.instr{font-size:14.5px;color:var(--muted);margin:-6px 0 0}
.instr b{color:var(--ink)}

/* notes */
.notes{border:1.5px solid var(--ink);border-radius:6px;padding:16px;font-family:var(--f-read);font-size:17px;line-height:2.1}
.notes h3{text-align:center;font-size:19px;margin:0 0 6px;font-weight:600}
.notes h4{font-family:var(--f-ui);font-size:15px;margin:10px 0 0;font-weight:700}
.notes ul{margin:0;padding-left:1.2em}
.num{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;white-space:nowrap;flex:none;border-radius:6px;background:var(--brand);color:var(--brand-ink);font-family:var(--f-ui);font-size:12.5px;font-weight:700;margin-right:4px;vertical-align:1px}
input.gap{font:inherit;font-family:var(--f-ui);font-size:16px;font-weight:700;width:8.5em;max-width:62vw;border:0;border-bottom:2px solid var(--brand);background:var(--brand-soft);color:var(--ink);padding:1px 8px;border-radius:6px 6px 0 0;line-height:1.6}
input.gap:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
input.gap.ok{background:var(--good-soft);border-color:var(--good)} input.gap.no{background:var(--bad-soft);border-color:var(--bad)}

/* table, as cards on phones */
.tbl{display:grid;grid-template-columns:1fr;gap:12px}
.trow{border:1.5px solid var(--ink);border-radius:6px;display:grid;grid-template-columns:1fr}
.tcell{padding:10px 12px;border-top:1px solid var(--line);font-family:var(--f-read);font-size:16.5px;line-height:2}
.tcell:first-child{border-top:0}
.tcell small{display:block;font-family:var(--f-ui);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.tcell p{margin:0}
@media (min-width:760px){.trow{grid-template-columns:.9fr .9fr 1.4fr 1.3fr}.tcell{border-top:0;border-left:1px solid var(--line)}.tcell:first-child{border-left:0}}

/* choices */
.qline{font-weight:700;font-size:16.5px;display:flex;gap:8px;align-items:flex-start}
.choices{display:flex;flex-direction:column;gap:7px}
.choice{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15.5px}
.choice .key{flex:none;width:26px;height:26px;border-radius:6px;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.choice[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.choice[aria-checked="true"] .key{background:var(--brand);color:var(--brand-ink)}
.choice.right{border-color:var(--good)} .choice.right .key{background:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)} .choice.wrong .key{background:var(--bad);color:#fff}
.picked{font-size:13px;color:var(--muted)}
.mcitem{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.mcitem:first-of-type{border-top:0;padding-top:0}

/* select rows (map + matching) */
.box{border:1.5px solid var(--ink);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.box b{font-size:14px;margin-bottom:2px}
.box div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
.srows{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow label{font-size:16px;font-weight:700}
.srow select{font:inherit;font-size:16px;font-weight:700;padding:8px;border-radius:8px;border:1.5px solid var(--brand);background:var(--brand-soft);color:var(--ink);width:100%}
.srow select.ok{background:var(--good-soft);border-color:var(--good)} .srow select.no{background:var(--bad-soft);border-color:var(--bad)}
.srow .rv{grid-column:1/-1}
.mapbtn{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;position:relative;cursor:zoom-in}
.mapbtn img{display:block;width:100%;height:auto}
.mapbtn span{position:absolute;right:10px;bottom:10px;background:var(--brand);color:var(--brand-ink);font-size:12.5px;font-weight:700;border-radius:14px;padding:5px 11px}

/* review marks */
.rv{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-family:var(--f-ui);font-size:13.5px;line-height:1.4;margin:2px 0 6px}
.rv .m{font-weight:700;border-radius:12px;padding:2px 10px}
.rv .m.ok{background:var(--good-soft);color:var(--good)} .rv .m.no{background:var(--bad-soft);color:var(--bad)} .rv .m.half{background:var(--part-soft);color:var(--part)}
.rv .sbtn{border:1.5px solid var(--brand);color:var(--brand);background:transparent;border-radius:12px;padding:2px 10px;font-weight:700;font-size:12.5px}
.notes .rv{display:flex;margin:0 0 4px}

/* script */
.script{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.script h2{font-family:var(--f-read);font-weight:600;font-size:21px;margin:0}
.sl{font-family:var(--f-read);font-size:16.5px;line-height:1.6;margin:0;padding:6px 8px;border-radius:8px;scroll-margin-top:150px}
.sl b{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-right:6px}
.sl .qc{display:inline-block;font-family:var(--f-ui);font-size:11.5px;font-weight:700;background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:0 7px;margin-left:6px;vertical-align:2px}
.seg{border-radius:4px;scroll-margin-top:150px}
.seg.on{background:var(--mark);box-shadow:0 0 0 3px var(--mark)}

/* nav + cards */
.navrow{display:flex;gap:8px}
.btn{flex:1;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.45}
.confirm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.overlay{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--bg);padding-block:28px}
.card{max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--f-read);font-weight:600;font-size:26px;line-height:1.15;margin:0}
.kick{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.fact b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--muted)}
.plist{display:flex;flex-direction:column;gap:6px;font-size:15px}
.plist div{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px}
.plist b{color:var(--brand)}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field input{width:100%;font:inherit;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.big{height:50px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:17px}
.big:disabled{opacity:.45}
.hint{font-size:13px;color:var(--muted);margin:0}
.audio{display:flex;flex-direction:column;gap:6px}
.audio audio{width:100%}
.score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.score b{font-size:56px;line-height:1;font-variant-numeric:tabular-nums;color:var(--brand)}
.score span{font-size:20px;color:var(--muted)}
.band{align-self:flex-start;background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:4px 14px;font-weight:700}
.pscores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pscores div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.pscores b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.pscores span{font-size:12px;color:var(--muted)}
#copyArea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink);resize:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{min-width:130px}
.linkbtn{align-self:flex-start;border:1.5px solid var(--brand);color:var(--brand);background:transparent;border-radius:8px;padding:7px 12px;font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:60}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(5,12,24,.92);display:flex;flex-direction:column}
.lb-bar{display:flex;gap:8px;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.lb-bar button{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:#fff;color:#152033}
.lb-scroll{flex:1;overflow:auto;padding:0 12px 16px}
.lb-scroll img{display:block;width:100%;max-width:1100px;margin:0 auto;background:#fff;border-radius:6px}
.lightbox.zoomed .lb-scroll img{width:auto;max-width:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

t", "waists"], "38": ["perfume"], "39": ["image"], "40": ["handbag"]}, "pairs": {"11-12": ["B", "E"], "13-14": ["B", "C"], "25-26": ["A", "B"]}, "bands": [[39, 9], [37, 8.5], [35, 8], [32, 7.5], [30, 7], [26, 6.5], [23, 6], [18, 5.5], [16, 5], [13, 4.5], [11, 4], [9, 3.5], [7, 3], [5, 2.5]], "script": {"1": [{"s": "Woman", "g": [{"t": "So, I understand you’re interested in restaurant work?", "q": []}]}, {"s": "Man", "g": [{"t": "Yes. I’ve got a bit of experience and I can provide references.", "q": []}]}, {"s": "Woman", "g": [{"t": "That’s good. I can check all that later. Now, Milo’s Restaurants have some vacancies at the moment. They’re a really good company to work for. Lots of benefits.", "q": []}]}, {"s": "Man", "g": [{"t": "Oh right.", "q": []}]}, {"s": "Woman", "g": [{"t": "Yes. They’ve got a very good reputation for looking after staff. For example, all employees get training – even temporary staff.", "q": [1]}]}, {"s": "Man", "g": [{"t": "Oh really? That’s quite unusual, isn’t it?", "q": []}]}, {"s": "Woman", "g": [{"t": "Certainly is.", "q": []}]}, {"s": "Man", "g": [{"t": "And do staff get free uniforms too?", "q": []}]}, {"s": "Woman", "g": [{"t": "Um … you just need to wear a white T-shirt and black trousers, it says here. So I guess not … But another benefit of working for a big company like this is that you can get a discount at any of their restaurants.", "q": [2]}]}, {"s": "Man", "g": [{"t": "Even at weekends?", "q": []}]}, {"s": "Woman", "g": [{"t": "No, but you’ll be working then anyway.", "q": []}]}, {"s": "Man", "g": [{"t": "Oh yes. I suppose so. Most of their restaurants are in the city centre, aren’t they? So, easy to get to by bus?", "q": []}]}, {"s": "Woman", "g": [{"t": "Yes. That’s right. But if you have to do a late shift and finish work after midnight, the company will pay for you to get a taxi home.", "q": [3]}]}, {"s": "Man", "g": [{"t": "I probably won’t need one. I think I’d use my bike.", "q": []}]}, {"s": "Woman", "g": [{"t": "OK. Now, they do have some quite specific requirements for the kind of person they’re looking for. Milo’s is a young, dynamic company and they’re really keen on creating a strong team. It’s really important that you can fit in and get on well with everyone.", "q": []}]}, {"s": "Man", "g": [{"t": "Yeah. I’ve got no problem with that. It sounds good, actually. The last place I worked for was quite demanding too. We had to make sure we gave a really high level of service.", "q": [4]}]}, {"s": "Woman", "g": [{"t": "That’s good to hear because that will be equally important at Milo’s. I know they want people who have an eye for detail.", "q": []}]}, {"s": "Man", "g": [{"t": "That’s fine. I’m very used to working in that kind of environment.", "q": []}]}, {"s": "Woman", "g": [{"t": "Perfect. So the only other thing that’s required is good communication skills, so you’ll need to have a certificate in English.", "q": [5]}]}, {"s": "Man", "g": [{"t": "Sure.", "q": []}]}, {"s": "Woman", "g": [{"t": "OK. Let’s have a look at the current job vacancies at Milo’s. The first one is in Wivenhoe Street.", "q": [6]}]}, {"s": "Man", "g": [{"t": "Sorry, where?", "q": []}]}, {"s": "Woman", "g": [{"t": "Wivenhoe. W-l-V-E-N-H-O-E. It’s quite central, just off Cork Street.", "q": []}]}, {"s": "Man", "g": [{"t": "Oh right.", "q": []}]}, {"s": "Woman", "g": [{"t": "They’re looking for a breakfast supervisor.", "q": []}]}, {"s": "Man", "g": [{"t": "That would be OK.", "q": []}]}, {"s": "Woman", "g": [{"t": "So you’re probably familiar with the kind of responsibilities involved. Obviously checking that all the portions are correct, etc., and then things like checking all the procedures for cleaning the equipment are being followed.", "q": [7]}]}, {"s": "Man", "g": [{"t": "OK. And what about the salary? In my last job I was getting £9.50 per hour. I was hoping to get a bit more than that.", "q": []}]}, {"s": "Woman", "g": [{"t": "Well, to begin with, you’d be getting £9.75 but that goes up to £11.25 after three months.", "q": [8]}]}, {"s": "Man", "g": [{"t": "That’s not too bad. And I suppose it’s a very early start?", "q": []}]}, {"s": "Woman", "g": [{"t": "Mmm. That’s the only unattractive thing about this job. But then you have the afternoons and evenings free. So the restaurant starts serving breakfast from 7 a.m. And you’d have to be there at 5.30 to set everything up. But you’d be finished at 12.30.", "q": []}]}, {"s": "Man", "g": [{"t": "Mmm. Well, as you say, there are advantages to that.", "q": []}]}, {"s": "Woman", "g": [{"t": "Now, you might also be interested in the job at the City Road branch. That’s for a junior chef, so again a position of responsibility.", "q": []}]}, {"s": "Man", "g": [{"t": "I might prefer that, actually.", "q": []}]}, {"s": "Woman", "g": [{"t": "Right, well obviously this role would involve supporting the sous chef and other senior staff. And you’d be responsible for making sure there’s enough stock each week – and sorting out all the deliveries.", "q": [9]}]}, {"s": "Man", "g": [{"t": "I’ve never done that before, but I imagine it’s fairly straightforward, once you get the hang of it.", "q": []}]}, {"s": "Woman", "g": [{"t": "Yes, and you’d be working alongside more experienced staff to begin with, so I’m sure it wouldn’t be a problem. The salary’s slightly higher here. It’s an annual salary of £23,000.", "q": []}]}, {"s": "Man", "g": [{"t": "Right.", "q": []}]}, {"s": "Woman", "g": [{"t": "I know that if they like you, it’s likely you’ll be promoted quite quickly. So that’s worth thinking about.", "q": []}]}, {"s": "Man", "g": [{"t": "Yes. It does sound interesting. What are the hours like?", "q": []}]}, {"s": "Woman", "g": [{"t": "The usual, I think. There’s a lot of evening and weekend work, but they’re closed on Mondays. But you do get one Sunday off every four weeks. So would you like me to send off your …", "q": [10]}]}], "2": [{"s": null, "g": [{"t": "Hello everyone. It’s good to see that so many members of the public have shown up for our presentation on the new housing development planned on the outskirts of Nunston. I’m Mark Reynolds and I’m Communications Manager at the development.", "q": []}]}, {"s": null, "g": [{"t": "I’ll start by giving you a brief overview of our plans for the development. So one thing I’m sure you’ll want to know is why we’ve selected this particular site for a housing development. At present it’s being used for farming, like much of the land around Nunston. But because of the new industrial centre in Nunston, there’s a lot of demand for housing for employees in the region, as many employees are having to commute long distances at present. Of course, there’s also the fact that we have an international airport just 20 minutes’ drive away, but although that’s certainly convenient, it wasn’t one of our major criteria for choosing the site. We were more interested in the fact that there’s an excellent hospital just 15 kilometres away, and a large secondary school even closer than that. One drawback to the site is that it’s on quite a steep slope, but we’ve taken account of that in our planning so it shouldn’t be a major problem.", "q": [11, 12]}]}, {"s": null, "g": [{"t": "We’ve had a lot of positive feedback about the plans. People like the wide variety of accommodation types and prices, and the fact that it’s only a short drive to get out into the countryside from the development. We were particularly pleased that so many people liked the designs for the layout of the development, with the majority of people saying it generally made a good impression and blended in well with the natural features of the landscape, with provision made for protecting trees and wildlife on the site. Some people have mentioned that they’d like to see more facilities for cyclists, and we’ll look at that, but the overall feedback has been that the design and facilities of the development make it seem a place where people of all ages can live together happily.", "q": [13, 14]}]}, {"s": null, "g": [{"t": "So I’ll put a map of the proposed development up on the screen. You’ll see it’s bounded on the south side by the main road, which then goes on to Nunston. Another boundary is formed by London Road, on the western side of the development. Inside the development there’ll be about 400 houses and 3 apartment blocks.", "q": []}]}, {"s": null, "g": [{"t": "There’ll also be a school for children up to 11 years old. If you look at the South Entrance at the bottom of the map, there’s a road from there that goes right up through the development. The school will be on that road, at the corner of the second turning to the left.", "q": [15]}]}, {"s": null, "g": [{"t": "A large sports centre is planned with facilities for indoor and outdoor activities. This will be on the western side of the development, just below the road that branches off from London Road.", "q": [16]}]}, {"s": null, "g": [{"t": "There’ll be a clinic where residents can go if they have any health problems. Can you see the lake towards the top of the map? The clinic will be just below this, to the right of a street of houses.", "q": [17]}]}, {"s": null, "g": [{"t": "There’ll also be a community centre for people of all ages. On the northeast side of the development, there’ll be a row of specially designed houses specifically for residents over 65, and the community centre will be adjoining this.", "q": [18]}]}, {"s": null, "g": [{"t": "We haven’t forgotten about shopping. There’ll be a supermarket between the two entrances to the development. We’re planning to leave the three large trees near London Road, and it’ll be just to the south of these.", "q": [19]}]}, {"s": null, "g": [{"t": "It’s planned to have a playground for younger children. If you look at the road that goes up from the South Entrance, you’ll see it curves round to the left at the top, and the playground will be in that curve, with nice views of the lake.", "q": [20]}]}, {"s": null, "g": [{"t": "OK, so now does anyone …", "q": []}]}], "3": [{"s": "Adam", "g": [{"t": "So, Michelle, shall we make a start on our presentation? We haven’t got that much time left.", "q": []}]}, {"s": "Michelle", "g": [{"t": "No, Adam. But at least we’ve done all the background reading. I found it really interesting – I’d never even heard of the Laki eruption before this.", "q": []}]}, {"s": "Adam", "g": [{"t": "Me neither. I suppose 1783 is a long time ago.", "q": []}]}, {"s": "Michelle", "g": [{"t": "But it was a huge eruption and it had such devastating consequences.", "q": []}]}, {"s": "Adam", "g": [{"t": "I know. It was great there were so many primary sources to look at. It really gives you a sense of how catastrophic the volcano was. People were really trying to make sense of the science for the first time.", "q": []}]}, {"s": "Michelle", "g": [{"t": "That’s right. But what I found more significant was how it impacted directly and indirectly on political events, as well as having massive social and economic consequences.", "q": [21]}]}, {"s": "Adam", "g": [{"t": "I know. That should be the main focus of our presentation.", "q": []}]}, {"s": "Michelle", "g": [{"t": "The observations made by people at the time were interesting, weren’t they? I mean, they all gave a pretty consistent account of what happened, even if they didn’t always use the same terminology.", "q": []}]}, {"s": "Adam", "g": [{"t": "Yeah. I was surprised there were so many weather stations established by that time – so, you know, you can see how the weather changed, often by the hour.", "q": [22]}]}, {"s": "Michelle", "g": [{"t": "Right. Writers at the time talked about the Laki haze to describe the volcanic fog that spread across Europe. They all realised that this wasn’t the sort of fog they were used to – and of course this was in pre-industrial times- so they hadn’t experienced sulphur-smelling fog before.", "q": []}]}, {"s": "Adam", "g": [{"t": "No, that’s true.", "q": []}]}, {"s": "Michelle", "g": [{"t": "Reports from the period blamed the haze for an increase in headaches, respiratory issues and asthma attacks. And they all describe how it covered the sun and made it look a strange red colour.", "q": [23]}]}, {"s": "Adam", "g": [{"t": "Must have been very weird.", "q": []}]}, {"s": "Michelle", "g": [{"t": "It’s interesting that Benjamin Franklin wrote about the haze. Did you read that? He was the American ambassador in Paris at the time.", "q": []}]}, {"s": "Adam", "g": [{"t": "Yeah. At first no one realised that the haze was caused by the volcanic eruption in Iceland.", "q": []}]}, {"s": "Michelle", "g": [{"t": "It was Benjamin Franklin who realised that before anyone else.", "q": [24]}]}, {"s": "Adam", "g": [{"t": "He’s often credited with that, apparently. But a French naturalist beat him to it – I can’t remember his name. I’d have to look it up. Then other naturalists had the same idea – all independently of each other.", "q": []}]}, {"s": "Michelle", "g": [{"t": "Oh right. We should talk about the immediate impact of the eruption, which was obviously enormous- especially in Iceland, where so many people died.", "q": []}]}, {"s": "Adam", "g": [{"t": "Mmm. You’d expect that- and the fact that the volcanic ash drifted so swiftly – but not that the effects would go on for so long. Or that two years after the eruption, strange weather events were being reported as far away as North America and North Africa.", "q": [25, 26]}]}, {"s": "Michelle", "g": [{"t": "No. I found all that hard to believe too. It must have been terrible- and there was nothing anyone could do about it, even if they knew the ash cloud was coming in their direction.", "q": []}]}, {"s": "Michelle", "g": [{"t": "We should run through some of the terrible consequences of the eruption experienced in different countries. There’s quite a varied range.", "q": []}]}, {"s": "Adam", "g": [{"t": "Starting with Iceland, where the impact on farming was devastating.", "q": []}]}, {"s": "Michelle", "g": [{"t": "Mmm. One of the most dramatic things there was the effect on livestock as they grazed in the fields. They were poisoned because they ate vegetation that had been contaminated with fluorine as a result of the volcanic fallout.", "q": [27]}]}, {"s": "Adam", "g": [{"t": "That was horrible. In Egypt, the bizarre weather patterns led to a severe drought and as a result the Nile didn’t flood, which meant the crops all failed.", "q": []}]}, {"s": "Michelle", "g": [{"t": "It’s so far from where the eruption happened and yet the famine there led to more people dying than any other country. It was worse than the plague.", "q": [28]}]}, {"s": "Adam", "g": [{"t": "OK. Then in the UK the mortality rate went up a lot- presumably from respiratory illnesses. According to one report it was about double the usual number and included an unusually high percentage of people under the age of 25.", "q": [29]}]}, {"s": "Michelle", "g": [{"t": "Mmm. I think people will be surprised to hear that the weather in the USA was badly affected too. George Washington even makes a note in his diary that they were snowbound until March in Virginia. That was before he became president.", "q": []}]}, {"s": "Adam", "g": [{"t": "Yes, and there was ice floating down the Mississippi, which was unprecedented.", "q": [30]}]}, {"s": "Michelle", "g": [{"t": "Astonishing, really. Anyway, what do you think …", "q": []}]}], "4": [{"s": null, "g": [{"t": "Good morning. Now, we’ve been asked to choose an aspect of European clothing or fashion and to talk about its development over time.", "q": []}]}, {"s": null, "g": [{"t": "I decided to focus on a rather small area of clothing and that’s pockets. I chose pockets for two reasons, really. We all have them – in jeans, jackets, coats, for example – and even though we often carry bags or briefcases as well, nothing is quite as convenient as being able to pop your phone or credit card into your pocket. Yet, I suspect that, other than that, people don’t really think about pockets too much and they’re rather overlooked as a fashion item.", "q": [31]}]}, {"s": null, "g": [{"t": "It’s certainly very interesting to go back in time and see how pockets developed for men and women. In the 18th century, fashions were quite different from the way they are now, and pockets were too. If we think about male fashion first … that was the time when suits became popular.", "q": [32]}, {"t": "Trousers were knee-length only and referred to as ‘breeches’, the waistcoats were short and the jackets were long, but all three garments were lined with material and pockets were sewn into this cloth by whichever tailor the customer used.", "q": [33]}, {"t": "The wearer could then carry small objects such as pencils or coins on their person and reach them through a gap in the lining. Coat pockets became increasingly decorative on the outside for men who wanted to look stylish, but they were often larger but plainer if the wearer was someone with a profession who needed to carry medical instruments – a doctor or physician, for example.", "q": [34]}]}, {"s": null, "g": [{"t": "The development of women’s pockets was a little different. For one thing, they weren’t nearly as visible or as easy to reach as men’s.", "q": [35]}, {"t": "In the 18th and 19th centuries, women carried numerous possessions on their person and some of these could be worth a lot of money. Women were more vulnerable to theft and wealthy women, in particular, worried constantly about pickpockets. So – what they did was to have a pair of pockets made that were tied together with string.", "q": [36]}, {"t": "The pockets were made of fabric, which might be recycled cloth if the wearer had little money or something more expensive, such as linen, sometimes featuring very delicate embroidery. Women tied the pockets around their waist so that they hung beneath their clothes.", "q": [37]}, {"t": "Remember, skirts were long then and there was plenty of room to hide a whole range of small possessions between the layers of petticoats that were commonly worn. They would have an opening in the folds of their skirts through which they could reach whatever they needed, like their perfume.", "q": [38]}, {"t": "Working women, of course, also needed to carry around items that they might use for whatever job or trade they were involved in, but their pairs of pockets still remained on the inside of their clothing, they just got bigger or longer sometimes reaching down to their knees!", "q": []}]}, {"s": null, "g": [{"t": "So the tie-on pockets went well into the 19th century and only changed when fashion altered towards the end of that period. That’s when dresses became tighter and less bulky, and the pairs of pockets became very noticeable – they stood out too much and detracted from the woman’s image.", "q": [39]}, {"t": "Women who had been used to carrying around a range of personal possessions – and still wanted to – needed somewhere to carry these items about their person. That was when small bags, or pouches as they were known, came into fashion and, of course, they inevitably led on to the handbag of more modern times, particularly when fashion removed pockets altogether.", "q": [40]}]}]}};
const KEY = "lm-listening-1";
const LIMIT = 40*60;
const $ = id => document.getElementById(id);
const main=$("main"), overlay=$("overlay"), timerEl=$("timer");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s||"").toLowerCase().replace(/[£$]/g,"").replace(/[‘’'".,;:!?]+$/,"").replace(/^[‘’'"]+/,"").replace(/\s+/g," ").trim();
let S = load() || {name:"",startedAt:0,answers:{},submitted:false,usedSec:0,part:1,view:"part"};
let tick=null, confirming=false, hasAudio=false;
function load(){ try{ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- marking ---------- */
const textQ = n => Array.isArray(D.key[n]);
function qMarks(n){                       // marks for a single-answer question
  const v=S.answers[n];
  if(textQ(n)) return D.key[n].map(norm).includes(norm(v))?1:0;
  return v===D.key[n]?1:0;
}
function pairMarks(k){ const v=S.answers[k]||[]; return v.filter(x=>D.pairs[k].includes(x)).length; }
function partQs(p){ return ({1:[1,10],2:[11,20],3:[21,30],4:[31,40]})[p]; }
function partScore(p){
  const [a,b]=partQs(p); let s=0;
  for(let n=a;n<=b;n++){ const pk=Object.keys(D.pairs).find(k=>k.split("-").map(Number).includes(n)); if(pk){ if(n===+pk.split("-")[0]) s+=pairMarks(pk); } else s+=qMarks(n); }
  return s;
}
const score = () => [1,2,3,4].reduce((s,p)=>s+partScore(p),0);
function band(r){ for(const [m,b] of D.bands) if(r>=m) return b; return "below 2.5"; }
function answeredIn(p){
  const [a,b]=partQs(p); let c=0;
  for(let n=a;n<=b;n++){ const pk=Object.keys(D.pairs).find(k=>k.split("-").map(Number).includes(n)); if(pk){ if(n===+pk.split("-")[0]) c+=Math.min(2,(S.answers[pk]||[]).length); } else if(norm(S.answers[n])) c++; }
  return c;
}
function fmt(sec){ sec=Math.max(0,Math.round(sec)); return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"); }
const remaining = () => LIMIT-(Date.now()-S.startedAt)/1000;

/* ---------- review marks ---------- */
function rvSingle(n, shown){
  if(!S.submitted) return "";
  const ok=qMarks(n)===1; const ans=textQ(n)?D.key[n][0]:D.key[n];
  return `<span class="rv"><span class="m ${ok?"ok":"no"}">${n} ${ok?"✓":"✗"}</span>${ok?"":`<span>Answer: <b>${esc(n===8?"£"+ans:ans)}</b>${textQ(n)&&D.key[n].length>1?` (or ${esc(D.key[n].slice(1).join(", "))})`:""}</span>`}<button class="sbtn" data-sq="${n}">Show in script</button></span>`;
}
function rvPair(k){
  if(!S.submitted) return "";
  const m=pairMarks(k), cls=m===2?"ok":m?"half":"no";
  return `<span class="rv"><span class="m ${cls}">${k.replace("-","&")}: ${m} of 2</span><span>Answer: <b>${D.pairs[k].join(", ")}</b> (either order)</span><button class="sbtn" data-sq="${k.split("-")[0]}">Show in script</button></span>`;
}

/* ---------- part sheet ---------- */
function gapHTML(n){
  const v=S.answers[n]||""; const cls=S.submitted?(qMarks(n)?" ok":" no"):"";
  return `<span class="num">${n}</span><input class="gap${cls}" data-q="${n}" value="${esc(v)}" aria-label="Answer ${n}" autocomplete="off" autocapitalize="off" spellcheck="false" ${S.submitted?"disabled":""}>`;
}
const fillGaps = s => esc(s).replace(/\[(\d+)\]/g,(_,n)=>gapHTML(+n));
const gapsIn = s => [...s.matchAll(/\[(\d+)\]/g)].map(m=>+m[1]);
function groupHTML(g){
  let h=`<section class="grp">`;
  const qsLabel = g.qs || g.ids.join(" and ");
  h+=`<div class="qs">Questions ${qsLabel}</div><p class="instr">${g.instr}</p>`;
  if(g.t==="notes"){
    h+=`<div class="notes"><h3>${esc(g.heading)}</h3>`; let open=false;
    g.lines.forEach(([k,t])=>{
      if(k==="h"){ if(open){h+="</ul>";open=false;} h+=`<h4>${esc(t)}</h4>`; }
      else { if(!open){h+="<ul>";open=true;} h+=`<li>${fillGaps(t)}${gapsIn(t).map(n=>rvSingle(n)).join("")}</li>`; }
    });
    if(open) h+="</ul>"; h+=`</div>`;
  } else if(g.t==="table"){
    h+=`<div class="tbl">${g.rows.map(r=>`<div class="trow">${r.map((cell,i)=>`<div class="tcell"><small>${esc(g.cols[i])}</small>${cell.map(t=>`<p>${fillGaps(t)}</p>${gapsIn(t).map(n=>rvSingle(n)).join("")}`).join("")}</div>`).join("")}</div>`).join("")}</div>`;
  } else if(g.t==="two"){
    const k=g.ids.join("-"); const sel=S.answers[k]||[];
    h+=`<div class="qline"><span class="num">${g.ids[0]}–${g.ids[1]}</span><span>${esc(g.q)}</span></div><div class="choices" role="group" aria-label="Choose two letters for questions ${g.ids.join(" and ")}">`;

      h+=`<div class="mcitem"><div class="qline"><span class="num">${n}</span><span>${esc(q)}</span></div><div class="choices" role="radiogroup" aria-label="Answer ${n}">${opts.map((t,i)=>{ const L="ABC"[i];
        let cls=""; if(S.submitted){ if(L===D.key[n]) cls=" right"; else if(v===L) cls=" wrong"; }
        return `<button class="choice${cls}" role="radio" aria-checked="${v===L}" data-one="${n}" data-o="${L}" ${S.submitted?"disabled":""}><span class="key">${L}</span><span>${esc(t)}</span></button>`; }).join("")}</div>${rvSingle(n)}</div>`;
    });
  } else if(g.t==="match"){
    h+=`<div class="box"><b>${esc(g.box)}</b>${g.opts.map((t,i)=>`<div><span><b>${"ABCDEF"[i]}</b></span><span>${esc(t)}</span></div>`).join("")}</div>`;
    h+=`<div class="srows">${g.rows.map(([n,label])=>selRow(n,label,"ABCDEF".split(""))).join("")}</div>`;
  }
  return h+`</section>`;
}
function selRow(n,label,letters){
  const v=S.answers[n]||""; const cls=S.submitted?(qMarks(n)?" ok":" no"):"";
  return `<div class="srow"><label for="sel${n}"><span class="num">${n}</span> ${esc(label)}</label><select id="sel${n}" class="${cls}" data-q="${n}" ${S.submitted?"disabled":""}><option value="">–</option>${letters.map(L=>`<option ${v===L?"selected":""}>${L}</option>`).join("")}</select>${rvSingle(n)}</div>`;
}
function scriptHTML(p){
  return `<section class="script" id="script"><div class="qs">Audioscript</div><h2>Part ${p}</h2>${D.script[p].map(l=>`<p class="sl">${l.s?`<b>${esc(l.s)}</b>`:""}${l.g.map(g=>`<span class="seg" data-qs="${g.q.join(" ")}">${esc(g.t)}${g.q.map(q=>`<span class="qc">Q${q}</span>`).join("")}</span>`).join(" ")}</p>`).join("")}</section>`;
}
function renderPart(){
  const p=S.part, P=D.parts[p-1], [a,b]=partQs(p);
  let h=`<div class="sheet"><div class="parthead"><span class="kick">Part ${p} · Questions ${a}–${b}</span><h1>${esc(P.title)}</h1></div>`;
  if(hasAudio && !S.submitted) h+=`<div class="grp audio"><div class="qs">Recording</div><audio controls preload="none" src="listening1.mp3"></audio></div>`;
  h+=P.groups.map(groupHTML).join("");
  if(S.submitted) h+=scriptHTML(p);
  h+=`</div>`;
  if(S.submitted){
    h+=`<div class="navrow"><button class="btn" id="prevP" ${p===1?"disabled":""}>Part ${p-1||1}</button><button class="btn pri" id="nextP">${p<4?`Part ${p+1}`:"My score"}</button></div>`;
  } else if(confirming){
    const left=40-[1,2,3,4].reduce((s,x)=>s+answeredIn(x),0);
    h+=`<div class="confirm"><span>${left?`You have <b>${left}</b> unanswered question${left>1?"s":""}. `:""}Submit the whole test now? You can't change your answers afterwards.</span><div class="row"><button class="btn" id="keep">Keep working</button><button class="btn pri" id="doSub">Submit</button></div></div>`;
  } else {
    h+=`<div class="navrow"><button class="btn" id="prevP" ${p===1?"disabled":""}>Back</button>${p<4?`<button class="btn pri" id="nextP">Part ${p+1}</button>`:""}<button class="btn ${p===4?"pri":""}" id="subBtn">Submit</button></div>`;
  }
  main.innerHTML=h;
  wire();
}
function wire(){
  main.querySelectorAll("input.gap").forEach(i=>i.oninput=()=>{ S.answers[i.dataset.q]=i.value; save(); renderTabs(); });
  main.querySelectorAll("select[data-q]").forEach(s=>s.onchange=()=>{ S.answers[s.dataset.q]=s.value; save(); renderTabs(); });
  main.querySelectorAll("[data-one]").forEach(b=>b.onclick=()=>{ S.answers[b.dataset.one]=b.dataset.o; save(); keepScroll(renderPart); renderTabs(); });
  main.querySelectorAll("[data-two]").forEach(b=>b.onclick=()=>{ const k=b.dataset.two; let sel=(S.answers[k]||[]).slice(); const L=b.dataset.o;
    if(sel.includes(L)) sel=sel.filter(x=>x!==L); else if(sel.length<2) sel.push(L); S.answers[k]=sel.sort(); save(); keepScroll(renderPart); renderTabs(); });
  main.querySelectorAll("[data-sq]").forEach(b=>b.onclick=()=>showScript(+b.dataset.sq));
  main.querySelectorAll("[data-zoom]").forEach(b=>b.onclick=()=>zoom(b.querySelector("img")));
  const pv=$("prevP"), nx=$("nextP"), sb=$("subBtn"), kp=$("keep"), ds=$("doSub");
  if(pv) pv.onclick=()=>goPart(S.part-1);
  if(nx) nx.onclick=()=>{ if(S.submitted && S.part===4){ S.view="res"; save(); render(); } else goPart(S.part+1); };
  if(sb) sb.onclick=()=>{ confirming=true; renderPart(); main.lastElementChild.scrollIntoView({block:"end"}); };
  if(kp) kp.onclick=()=>{ confirming=false; renderPart(); };
  if(ds) ds.onclick=()=>submit(false);
}
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }
function goPart(p){ if(p<1||p>4) return; S.part=p; S.view="part"; confirming=false; save(); render(); window.scrollTo(0,0); }
function showScript(q){
  document.querySelectorAll(".seg.on").forEach(e=>e.classList.remove("on"));
  const el=[...document.querySelectorAll(".seg")].find(e=>e.dataset.qs.split(" ").includes(String(q)));
  if(el){ el.classList.add("on"); el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"}); }
}
function zoom(img){
  const lb=document.createElement("div"); lb.className="lightbox"; lb.setAttribute("role","dialog"); lb.setAttribute("aria-modal","true"); lb.setAttribute("aria-label","Enlarged map");
  lb.innerHTML=`<div class="lb-bar"><button data-z>Zoom in</button><button data-x>Close</button></div><div class="lb-scroll"><img src="${img.src}" alt="${esc(img.alt)}"></div>`;
  document.body.appendChild(lb); document.body.style.overflow="hidden";
  const close=()=>{ lb.remove(); document.body.style.overflow=""; document.removeEventListener("keydown",k); };
  const k=e=>{ if(e.key==="Escape") close(); };
  lb.querySelector("[data-x]").onclick=close; document.addEventListener("keydown",k);
  const z=lb.querySelector("[data-z]"); z.onclick=()=>{ lb.classList.toggle("zoomed"); z.textContent=lb.classList.contains("zoomed")?"Fit to screen":"Zoom in"; };
  lb.querySelector("[data-x]").focus();
}

/* ---------- tabs, timer, views ---------- */
function renderTabs(){
  $("tabs").innerHTML=[1,2,3,4].map(p=>`<button class="tab" role="tab" aria-selected="${S.view==="part"&&S.part===p}" data-p="${p}"><b>Part ${p}</b><span>${S.submitted?`${partScore(p)}/10 correct`:`${answeredIn(p)}/10 done`}</span></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(t=>t.onclick=()=>goPart(+t.dataset.p));
}
function startTimer(){
  clearInterval(tick);
  const upd=()=>{ if(S.submitted){ clearInterval(tick); return; } const r=remaining(); timerEl.textContent=fmt(r);
    timerEl.classList.toggle("warn",r<=300&&r>60); timerEl.classList.toggle("crit",r<=60); if(r<=0) submit(true); };
  upd(); tick=setInterval(upd,1000);
}
function render(){
  overlay.hidden=true; $("top").hidden=false;
  if(S.submitted){ timerEl.textContent=score()+"/40"; timerEl.classList.remove("warn","crit"); } else startTimer();
  renderTabs();
  if(S.submitted && S.view==="res") renderResult(); else renderPart();
}
function submit(auto){
  if(S.submitted) return;
  S.submitted=true; S.usedSec=Math.min(LIMIT,(Date.now()-S.startedAt)/1000); S.auto=!!auto; S.view="res"; confirming=false;
  clearInterval(tick); save(); if(document.activeElement) document.activeElement.blur(); render(); window.scrollTo(0,0);
}
const resultText = () => `Listening Test 1 | ${S.name} | ${score()}/40 | P1 ${partScore(1)} · P2 ${partScore(2)} · P3 ${partScore(3)} · P4 ${partScore(4)} | band ${band(score())} | time ${fmt(S.usedSec)}`;
function renderResult(){
  const sc=score();
  main.innerHTML=`<div class="card" style="max-width:none">
    <div class="kick">${S.auto?"Time's up · ":""}Your result</div>
    <div class="score"><b>${sc}</b><span>/ 40 correct</span></div>
    <span class="band">Band ${band(sc)}</span>
    <div class="pscores">${[1,2,3,4].map(p=>`<div><b>${partScore(p)}/10</b><span>Part ${p}</span></div>`).join("")}</div>
    <p class="hint">Send your result to your teacher: copy it, then paste it into the class chat.</p>
    <textarea id="copyArea" rows="3" readonly>${esc(resultText())}</textarea>
    <div class="row"><button class="btn pri" id="copyBtn">Copy my result</button><button class="btn" id="rev">Review answers</button></div>
    <div class="row" id="retakeRow"><button class="linkbtn" id="retake">Take the test again</button></div>
  </div>`;
  $("copyBtn").onclick=()=>{ const ta=$("copyArea"), txt=resultText(); const fb=()=>{ ta.focus(); ta.select(); toast("Text selected. Tap Copy to copy it."); };
    try{ navigator.clipboard.writeText(txt).then(()=>toast("Copied. Paste it in the chat."),fb); }catch(e){ fb(); } };
  $("rev").onclick=()=>goPart(1);
  $("retake").onclick=()=>{ $("retakeRow").innerHTML=`<div class="confirm" style="flex:1"><span>This clears all your answers and restarts the 40-minute timer.</span><div class="row"><button class="btn" id="rtNo">Cancel</button><button class="btn pri" id="rtYes">Start again</button></div></div>`;
    $("rtNo").onclick=renderResult; $("rtYes").onclick=()=>{ S.submitted=false; S.startedAt=0; S.answers={}; S.part=1; S.view="part"; save(); renderStart(); }; };
}
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; t.setAttribute("role","status"); document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function renderStart(){
  $("top").hidden=true; main.innerHTML=""; overlay.hidden=false;
  overlay.innerHTML=`<div class="card">
    <div class="kick">Luke Murgatroyd · IELTS Listening practice</div>
    <h2>Listening Test 1</h2>
    <div class="facts"><div class="fact"><b>40</b><span>minutes</span></div><div class="fact"><b>40</b><span>questions</span></div><div class="fact"><b>4</b><span>parts</span></div></div>
    <div class="plist">${D.parts.map(P=>`<div><b>Part ${P.n}</b><span>${esc(P.title)} · Q${partQs(P.n).join("–")}</span></div>`).join("")}</div>
    <ul>
      <li>Your teacher will play the recording. Write your answers as you listen.</li>
      <li>Use the tabs at the top to move between parts. You can go back to any part.</li>
      <li>Check your spelling: it counts.</li>
      <li>The test submits itself after 40 minutes.</li>
    </ul>
    <div class="field"><label for="nameIn">Your name</label><input id="nameIn" autocomplete="name" placeholder="e.g. Sara Al-Harbi" value="${esc(S.name)}"></div>
    <button class="big" id="startBtn" ${S.name.trim()?"":"disabled"}>Start the test</button>
    <p class="hint">Turn on Do Not Disturb and keep your phone upright. Your answers are saved on this phone if the page reloads.</p>
  </div>`;
  const ni=$("nameIn"), sb=$("startBtn");
  ni.oninput=()=>{ S.name=ni.value; sb.disabled=!ni.value.trim(); };
  ni.onkeydown=e=>{ if(e.key==="Enter"&&ni.value.trim()) start(); };
  sb.onclick=start;
}
function start(){ S.name=S.name.trim(); S.startedAt=Date.now(); S.answers={}; S.submitted=false; S.part=1; S.view="part"; save(); render(); window.scrollTo(0,0); }

/* optional recording: if a file called listening1.mp3 sits next to this page, a player appears */
try{ fetch("listening1.mp3",{method:"HEAD"}).then(r=>{ if(r.ok && (r.headers.get("content-type")||"").includes("audio")){ hasAudio=true; if(S.startedAt && !S.submitted && S.view==="part") keepScroll(renderPart); } }).catch(()=>{}); }catch(e){}

if(!S.startedAt) renderStart();
else if(!S.submitted && remaining()<=0) submit(true);
else render();
})();
</script>
</body>
</html>
