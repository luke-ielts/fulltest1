<style>
/* Layout: single-column course reader — sticky top bar with lesson menu and progress; home, lesson and quiz views swap in place. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#152033; --muted:#566479; --line:#D9E1EB;
  --brand:#02437E; --brand-ink:#FFFFFF; --brand-soft:#E2EBF6; --accent:#E8742F; --accent-soft:#FDEBDF;
  --good:#1B7443; --good-soft:#E1F2E8; --bad:#B42318; --bad-soft:#FBE7E5;
  --ill-bg:#E6EEF7; --ill-desk:#D9C3A3; --ill-desk2:#C8AE8A; --ill-paper:#FFFFFF; --ill-line:#B9C6D6; --ill-1:#02437E; --ill-2:#6FA3D6; --ill-3:#E8742F; --ill-4:#9DB7CF;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
img{max-width:100%}
[hidden]{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px}
.menu-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;height:40px;padding:0 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.menu-btn i{display:block;width:16px;height:2px;background:currentColor;box-shadow:0 5px 0 currentColor,0 -5px 0 currentColor}
.bar-title{flex:1;min-width:0}
.bar-title span{display:block;font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.bar-title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{flex:none;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:64px}
.prog b{display:block;font-size:15px;color:var(--brand)}
.progline{height:4px;background:var(--brand-soft)}
.progline i{display:block;height:100%;width:0;background:var(--brand);transition:width .4s}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,12,24,.45);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--surface);z-index:41;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto;display:flex;flex-direction:column;gap:6px;box-shadow:4px 0 24px rgba(0,0,0,.18)}
.drawer h2{font-family:var(--f-read);font-weight:600;font-size:19px;line-height:1.25;margin:0 0 10px}
.navitem{display:flex;gap:12px;align-items:center;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px;width:100%}
.navitem:hover{background:var(--bg)}
.navitem[aria-current="page"]{background:var(--brand-soft)}
.navitem small{display:block;font-size:12px;color:var(--muted)}
.navitem b{display:block;font-size:15px;line-height:1.3}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.tick.done{background:var(--good);border-color:var(--good);color:var(--surface)}
.drawer .closebtn{align-self:flex-start;margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700}

/* page */
main{max-width:880px;margin:0 auto;padding-block:20px 56px}
.col{max-width:68ch;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.kick{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-read);font-weight:600;font-size:clamp(28px,6vw,40px);line-height:1.12;margin:0;text-wrap:balance}
h2.bh{font-family:var(--f-read);font-weight:600;font-size:23px;line-height:1.25;margin:0 0 8px;text-wrap:balance}
.prose{font-family:var(--f-read);font-size:18px;line-height:1.65}
.prose p{margin:0 0 .8em}.prose p:last-child{margin-bottom:0}
.lede{font-family:var(--f-read);font-size:19px;line-height:1.6;color:var(--muted);margin:0}

/* figures */
.fig{position:relative;margin:0;border-radius:14px;overflow:hidden;background:var(--ill-bg)}
.lcard,.next,.col > .act{background:var(--brand-soft);border-color:transparent}
.fig svg{display:block;width:100%;height:auto}
.fig .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fig.banner{border-radius:0 0 14px 14px}
.fig .cap{position:relative;padding:10px 18px;background:var(--ill-1);color:var(--ill-bg);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.fig .cap p{margin:0}
.wide{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
@media (min-width:760px){.wide{margin-inline:-48px}.fig.banner{border-radius:14px}}

/* section rhythm */
.col.lesson{gap:32px}
.sec{border-top:1px solid var(--line);padding-top:30px}
.band{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:22px max(16px,env(safe-area-inset-left,0px)) 26px;background:var(--brand-soft);display:flex;flex-direction:column;gap:14px}
@media (min-width:760px){.band{margin-inline:-48px;padding:28px 48px 32px;border-radius:18px}}
.band-head{display:flex;align-items:center;gap:12px}
.band-icon{flex:none;width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.band-icon svg{width:22px;height:22px}
.band-head small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.band-head b{display:block;font-size:19px;line-height:1.25}
.band-head span.sub{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.band .act{border-color:transparent;box-shadow:0 1px 3px rgba(2,30,60,.08)}
.band .cards .flash{min-height:132px}
.flash .front{font-size:19px}
.band + .band{margin-top:-8px}

/* continue sections */
.chunk{display:flex;flex-direction:column;gap:32px;scroll-margin-top:calc(84px + env(safe-area-inset-top,0px))}
.cont{display:flex;align-items:center;gap:14px}
.cont::before,.cont::after{content:"";flex:1;height:1px;background:var(--line)}
.cont .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:30px}
.cont .done{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* callout */
.note{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start;background:var(--accent-soft);border-radius:14px;padding:18px}
.note-ic{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:22px;font-family:var(--f-read)}
.note .prose{font-size:18px;font-weight:600}
/* tabs */
.tabs{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tablist{display:flex;background:var(--brand-soft)}
.tablist button{flex:1;border:0;background:transparent;padding:14px 10px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
.tablist button[aria-selected="true"]{color:var(--brand);background:var(--surface);border-bottom-color:var(--brand)}
.tabpanel{padding:18px}
.tabpanel .prose{font-size:17px}
.tabpanel ul{margin:.4em 0 0;padding-left:1.2em}
/* tick boxes */
.choice .box{width:20px;height:20px;border-radius:5px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:13px;line-height:1;color:var(--brand-ink)}
.choice[aria-checked="true"] .box{border-color:var(--brand);background:var(--brand)}
.choice.right .box{border-color:var(--good);background:var(--good);color:var(--surface)}
.choice.wrong .box{border-color:var(--bad);background:var(--bad);color:var(--surface)}
/* text diagrams */
.dgm{margin:0;border-radius:14px;background:var(--ill-bg);padding:18px;display:flex;flex-direction:column;gap:12px;font-size:14.5px;line-height:1.45}
.fitb{font:inherit;font-size:17px;font-weight:700;width:9em;max-width:100%;border:0;border-bottom:2px solid var(--brand);background:var(--brand-soft);color:var(--ink);padding:3px 8px;margin:0 4px;border-radius:6px 6px 0 0}
.dg-cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.dg-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.dg-win,.dg-card,.dg-note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dg-card small,.dg-note small{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dg-card p{margin:0}
.dg-winbar{display:flex;align-items:center;gap:5px;margin:-14px -14px 4px;padding:9px 12px;background:var(--brand-soft);border-radius:12px 12px 0 0}
.dg-winbar i{width:9px;height:9px;border-radius:50%;background:var(--ill-4)}
.dg-winbar b{margin-left:8px;font-size:14px;color:var(--brand)}
.dg-search{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:22px;padding:6px 6px 6px 14px}
.dg-search span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg-search em{font-style:normal;font-weight:700;font-size:13px;background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:5px 12px}
.dg-sub{color:var(--muted);font-size:13px}
.dg-res{display:flex;flex-direction:column;gap:5px;padding-top:8px;border-top:1px solid var(--line)}
.dg-line{height:8px;border-radius:4px;background:var(--brand);opacity:.55;width:85%}.dg-line.short{width:60%;background:var(--ill-line);opacity:1}
.dg-chips{display:flex;flex-wrap:wrap;gap:6px}
.dg-chips span{font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:3px 10px}
.dg-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.dg-tile{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line)}
.dg-tile b{font-family:var(--f-read);font-size:34px;line-height:1;color:var(--accent)}
.dg-tile.t0 b,.dg-tile.t2 b,.dg-tile.t4 b{color:var(--brand)}
.dg-tile strong{font-size:16px}
.dg-tile span{color:var(--muted);font-size:14px}
.dg-three{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.dg-src{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.dg-ic{width:44px;height:44px;color:var(--brand)}.dg-ic svg{width:100%;height:100%}
.dg-src strong{font-size:15.5px;line-height:1.3}
.dg-src span{color:var(--muted);font-size:14px}
.dg-src em{font-style:normal;font-weight:700;align-self:flex-start;border-radius:12px;padding:3px 12px;font-size:13.5px}
.dg-src em.ok{background:var(--good-soft);color:var(--good)} .dg-src em.no{background:var(--bad-soft);color:var(--bad)}
.dg-notehead{font-family:var(--f-read);font-weight:600;font-size:17px;color:var(--brand)}
.dg-entry{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 12px;padding-top:10px;border-top:1px dashed var(--line)}
.dg-entry div{display:flex;flex-direction:column}
.dg-entry span{font-size:14px}
.dg-entry.empty span{height:18px;border-bottom:1.5px solid var(--line)}
.dg-flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:560px){.dg-flow{grid-template-columns:minmax(0,1fr)}.dg-flow .dg-arrow{transform:rotate(90deg)}}
.dg-arrow{font-size:26px;font-weight:700;color:var(--brand);text-align:center;line-height:1}
.dg-arrow.down{transform:none}
.dg-stack{display:flex;flex-direction:column;gap:8px}
.dg-card.main{border-color:var(--brand)}
.dgm mark{border-radius:4px;padding:0 3px;color:var(--ink)}
.dgm mark.m0{background:#FFD8B8}.dgm mark.m1{background:#FBE7A6}.dgm mark.m2{background:#BFE6D5}.dgm mark.m3{background:#E3CCF0}
.hang{padding-left:1.6em;text-indent:-1.6em;margin:0}
.dg-refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dg-refs li{display:flex;flex-direction:column;gap:3px}
.dg-type{align-self:flex-start;font-size:11.5px;font-weight:700;background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:2px 9px}
.dg-az{align-self:flex-start;font-size:12.5px;font-weight:700;color:var(--accent)}
.dg-checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dg-checks li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:8px;border-radius:8px}
.dg-checks li.no{background:var(--bad-soft)} .dg-checks li.warn{background:var(--accent-soft)}
.dg-checks p{margin:0}
.dg-checks small{font-weight:700;font-size:12.5px;text-transform:none;letter-spacing:0}
.dg-checks li.ok small{color:var(--good)} .dg-checks li.no small{color:var(--bad)} .dg-checks li.warn small{color:var(--accent)}
.dg-mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--surface)}
.dg-checks li.ok .dg-mark{background:var(--good)} .dg-checks li.no .dg-mark{background:var(--bad)} .dg-checks li.warn .dg-mark{background:var(--accent)}

/* numbered list */
.nlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.nlist li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;font-family:var(--f-read);font-size:18px;line-height:1.55}
.nlist li > span{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-ui);font-weight:700;font-size:14px;margin-top:1px}
.nlist p{margin:0}

/* accordion */
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 4px;font-weight:700;font-size:17px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:20px;line-height:1}
.acc details[open] summary::after{content:"–"}
.acc .prose{padding:0 4px 18px;font-size:17px}

/* activity card */
.act{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.act .label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.act .q{font-size:18px;font-weight:700;line-height:1.4}
.act .q p{margin:0}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:16px}
.choice p{margin:0}
.choice .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none}
.choice[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.choice[aria-checked="true"] .dot{border-color:var(--brand);background:radial-gradient(circle,var(--brand) 45%,transparent 50%)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.right .dot{border-color:var(--good);background:radial-gradient(circle,var(--good) 45%,transparent 50%)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .dot{border-color:var(--bad);background:radial-gradient(circle,var(--bad) 45%,transparent 50%)}
.fb{border-radius:10px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-size:15px} .fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}
.fb p{margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font-weight:700;padding:12px 18px;font-size:16px}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.big{width:100%;padding:15px 18px;font-size:17px}

/* flashcards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.flash{perspective:900px;border:0;padding:0;background:transparent;min-height:170px;text-align:center}
.flash .in{position:relative;display:grid;width:100%;height:100%;min-height:132px;transition:transform .5s;transform-style:preserve-3d}
.flash[aria-pressed="true"] .in{transform:rotateY(180deg)}
.flash .face{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.flash .front{background:var(--brand);color:var(--brand-ink);font-family:var(--f-read);font-size:22px}
.flash .back{background:var(--surface);border:1.5px solid var(--brand);transform:rotateY(180deg);font-size:14px;line-height:1.4;padding:12px}
.flash small{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
@media (prefers-reduced-motion:reduce){.flash .in{transition:none}}

/* process */
.proc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.proc-dots{display:flex;gap:6px}
.proc-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.proc-dots i.on{background:var(--brand);width:22px;border-radius:4px}
.proc-step{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.proc-body h3{font-family:var(--f-read);font-weight:600;font-size:21px;margin:0 0 8px;line-height:1.3}
.proc-body .prose{font-size:17px}

/* sorting */
.sort-card{border-radius:12px;background:var(--accent-soft);border:1.5px solid var(--accent);padding:16px;font-family:var(--f-read);font-size:17px;line-height:1.5}
.sort-card.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.sort-card.shake{animation:none}}
.piles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pile{border:1.5px dashed var(--brand);background:var(--brand-soft);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:64px}
.pile b{color:var(--brand);font-size:15px}
.pile .placed{font-size:13px;line-height:1.35;background:var(--surface);border-radius:8px;padding:6px 8px;color:var(--ink)}
.sort-msg{font-size:15px;min-height:1.5em;color:var(--muted)}
.sort-msg.no{color:var(--bad)} .sort-msg.ok{color:var(--good)}

/* matching */
.match{display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;border:1.5px solid var(--line)}
.mrow.right{border-color:var(--good);background:var(--good-soft)} .mrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mrow p{margin:0;font-size:15.5px}
.mrow select{font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.mrow .ans{font-size:13px;color:var(--good);font-weight:700}

/* home */
.cover{display:flex;flex-direction:column;gap:20px}
.badge{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.badge i{width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-style:normal;font-size:13px;letter-spacing:.04em}
.lessons{display:flex;flex-direction:column;gap:10px}
.lcard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}
.lcard .num{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:16px}
.lcard .num.done{background:var(--good);color:var(--surface)}
.lcard b{display:block;font-size:16px;line-height:1.3}
.lcard small{display:block;font-size:13px;color:var(--muted)}
.lcard .go{color:var(--brand);font-weight:700;font-size:14px;white-space:nowrap}
.foot{border-top:1px solid var(--line);padding-top:18px;font-size:14px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.foot a{color:var(--brand)}

/* lesson end */
.next{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.next small{color:var(--muted);font-size:14px}

/* quiz */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-size:60px;line-height:1;font-variant-numeric:tabular-nums;color:var(--brand)}
.score span{font-size:20px;color:var(--muted)}
.pill{display:inline-flex;align-self:flex-start;align-items:center;border-radius:20px;padding:5px 14px;font-weight:700;font-size:15px}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.no{background:var(--bad-soft);color:var(--bad)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-weight:700}
.qbar{height:6px;border-radius:3px;background:var(--brand-soft);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--brand)}
.review{display:flex;flex-direction:column;gap:10px}
.rv{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:15px}
.rv .tick{width:24px;height:24px;font-size:12px}
.rv .tick.no{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.rv p{margin:0}
</style>

<script>
(function(){
const C = {"title": "Paraphrasing and Citing Sources: Essential Skills for Academic Writing", "description": "Are you ready to write confidently and avoid plagiarism in your university studies? This course will help you master the essentials of paraphrasing and citing academic sources, so you can express ideas in your own words and build strong, original writing skills. You'll discover how to recognize the difference between quoting, paraphrasing, and summarizing, learn practical strategies to restructure sentences, and apply citation rules correctly. With clear steps, familiar examples, and focused activities, you'll be prepared to succeed in academic writing at university.", "lessons": [{"title": "Understanding Paraphrasing and Academic Integrity", "blocks": [{"t": "banner", "img": "l1-banner", "cap": ""}, {"t": "text", "h": "Why Paraphrasing and Integrity Matter in University Writing", "p": "<p>In university, your teachers want to see your own thinking and understanding. Using your own words shows that you truly understand the material and helps build trust between you and your instructors. Learning how to paraphrase and cite sources correctly will help you succeed in your studies, both in Saudi Arabia and anywhere else in the world.<\/p>"}, {"t": "text", "h": "", "p": "<p>This lesson will guide you through essential concepts related to paraphrasing and academic writing. You will gain an understanding of key terms and practices that support academic integrity.<\/p>"}, {"t": "list", "items": ["<p>What paraphrasing means and why it is important<\/p>", "<p>What academic integrity and plagiarism are<\/p>", "<p>The difference between quoting, paraphrasing, and summarizing<\/p>", "<p>When to paraphrase in your writing<\/p>", "<p>The basics of citing your sources<\/p>"]}, {"t": "image", "img": "group-work", "cap": ""}, {"t": "text", "h": "Real-Life Example: Why Paraphrasing Matters", "p": "<p>Imagine you are a Saudi student writing an assignment about tourism in your country. You find useful ideas in several articles, but you cannot just copy the sentences. Instead, you need to explain those ideas in your own words. This is where paraphrasing becomes important - it helps you use information from sources without copying, so your work is original and honest.<\/p>"}, {"t": "text", "h": "Important Words for This Lesson", "p": "<p>Let’s learn some important words for this lesson. Click each card to see what the word means.<\/p>"}, {"t": "flash", "cards": [{"f": "<strong>Paraphrasing<\/strong>", "b": "Restating someone else’s idea in your own words, keeping the meaning but changing the language."}, {"f": "<strong>Academic integrity<\/strong>", "b": "Being honest and responsible in your studies by giving credit to others for their ideas."}, {"f": "<strong>Plagiarism<\/strong>", "b": "Using someone else’s words or ideas as if they are your own, without giving credit."}, {"f": "<strong>Citation<\/strong>", "b": "A way to show where you found information, giving credit to the original author."}]}, {"t": "cont"}, {"t": "text", "h": "What is Paraphrasing?", "p": "<p>Saying someone else's point accurately in your own words. In university, you often need to share ideas from books and articles, but you must use new sentences to show your understanding.<\/p>"}, {"t": "text", "h": "Why is Paraphrasing Important in Academic Writing?", "p": "<p>Paraphrasing is a key skill for university students. It helps you use information from sources while making your work original and honest. Click each reason below to learn more.<\/p>"}, {"t": "acc", "items": [{"h": "Helps you show your understanding", "p": "<p>When you paraphrase, you explain ideas in your own way. This shows your teachers that you really understand the material, not just copying it.<\/p><p>For example, if you read about Saudi tourism and explain it in your own words, your teacher can see your true understanding.<\/p>"}, {"h": "Avoids plagiarism", "p": "<p>Paraphrasing helps you avoid plagiarism, which is taking someone else’s words or ideas without giving credit. By using your own words and citing the source, you show honesty in your work.<\/p><p>This is very important in all Saudi universities and around the world.<\/p>"}, {"h": "Builds your own academic voice", "p": "<p>When you paraphrase, you develop your own style and voice in writing. This makes your assignments unique and personal.<\/p><p>Over time, you will become more confident in expressing your ideas.<\/p>"}, {"h": "Shows respect for original authors", "p": "<p>Paraphrasing with a citation shows you respect the work of others. You are not stealing their ideas, but building on them in your own way.<\/p><p>This is a key part of academic honesty in any field.<\/p>"}]}, {"t": "mc", "q": "Which of the following best describes paraphrasing?", "multi": false, "fb": "", "answers": [{"h": "Copying a sentence and changing a few words", "c": false, "f": "Changing a few words is not paraphrasing; it is too close to the original text."}, {"h": "Writing someone else’s idea in your own words", "c": true, "f": "Paraphrasing means restating someone else’s idea in your own words, showing you understand the concept."}, {"h": "Using a quote with quotation marks", "c": false, "f": "Using a quote with quotation marks is quoting, not paraphrasing."}, {"h": "Giving your own opinion without evidence", "c": false, "f": "Paraphrasing involves using someone else’s idea, not just your own opinion."}]}, {"t": "cont"}, {"t": "text", "h": "Academic Integrity and Plagiarism", "p": "<p>Academic integrity means being honest in your studies and always giving credit to others for their ideas. Plagiarism is when you use someone else’s words or ideas as your own, which is a serious problem at university. Understanding these concepts is important for your success and reputation as a student.<\/p>"}, {"t": "text", "h": "Academic Integrity and Plagiarism", "p": "<p>Click each tab to learn about academic integrity and plagiarism.<\/p>"}, {"t": "tabs", "items": [{"h": "What is academic integrity?", "p": "<p>Academic integrity is the practice of being honest and responsible in your academic work. It means always giving credit to the original authors when you use their ideas or words.<\/p><p>In Saudi universities, students are expected to follow strict rules about academic honesty. This helps create a fair and trustworthy learning environment for everyone.<\/p>"}, {"h": "What is plagiarism?", "p": "<p>Plagiarism is when you use someone else’s words or ideas without giving them credit. This can happen if you copy text directly or even if you use their ideas without mentioning the source.<\/p><p>Plagiarism is taken very seriously at universities. It can lead to penalties, failing grades, or even suspension from your studies.<\/p>"}, {"h": "Why does it matter?", "p": "<p>Academic integrity and avoiding plagiarism are important because they show respect for others’ work. They also help you build your own reputation as an honest and reliable student.<\/p><p>By following these rules, you help maintain the quality and trust of your university and your own academic record.<\/p>"}]}, {"t": "mc", "q": "Which action is an example of plagiarism?", "multi": false, "fb": "", "answers": [{"h": "Paraphrasing a source with a citation", "c": false, "f": "Paraphrasing with a citation is not plagiarism because you are giving proper credit to the original source."}, {"h": "Copying a paragraph and not giving credit", "c": true, "f": "Using someone’s words without giving credit is plagiarism because you are presenting someone else's work as your own."}, {"h": "Summarizing a study in your own words and citing it", "c": false, "f": "Summarizing with a citation is not plagiarism because you are both using your own words and giving credit to the original source."}, {"h": "Writing your own opinion", "c": false, "f": "Your own opinion is not plagiarism because it is your original work."}]}, {"t": "cont"}, {"t": "text", "h": "Quoting, Paraphrasing, and Summarizing: What’s the Difference?", "p": "<p>There are different ways to use information from sources in your writing. You can quote, paraphrase, or summarize. Each method has a different purpose and is used in different situations. Understanding the differences will help you choose the best way to include information in your assignments.<\/p>"}, {"t": "text", "h": "Sort Examples: Quote, Paraphrase, or Summarize", "p": "<p>Read each example below and decide if it is a quote, a paraphrase, or a summary. This will help you practice telling the difference between these three important skills.<\/p>"}, {"t": "sort", "piles": ["Quote", "Paraphrase", "Summarize"], "cards": [{"h": "“Tourism grew quickly after 2021.” (copied with quotation marks)", "p": 0}, {"h": "Tourism grew rapidly after 2021. (own words, same detail)", "p": 1}, {"h": "Tourism increased after 2021, according to the report. (main point only)", "p": 2}]}, {"t": "note", "p": "<p>Keep in mind that paraphrasing is more than just swapping out a few words. You need to rewrite the information using your own sentence structure, and always acknowledge the original source.<\/p>"}, {"t": "cont"}, {"t": "text", "h": "When and How Should You Paraphrase?", "p": "<p>Paraphrasing is most useful when you want to explain a reading in your own words or report research in your essays. For example, if you are writing about Vision 2030 in Saudi Arabia, you might paraphrase what a government report says to show you understand it, instead of copying the exact words. Paraphrasing is also helpful when you want to connect ideas from different sources in a clear, original way.<\/p>"}, {"t": "text", "h": "When to Use Quoting, Paraphrasing, or Summarizing", "p": "<p>Each method has its own best use. Expand each section below to learn when to use a quote, a paraphrase, or a summary in your writing.<\/p>"}, {"t": "acc", "items": [{"h": "When to quote", "p": "<p>Use a quote when the exact words are important, such as a famous saying or a definition you cannot improve. For example, if a Saudi leader says something memorable, you might quote it directly.<\/p><p>Quoting is best when the original wording is unique or powerful.<\/p>"}, {"h": "When to paraphrase", "p": "<p>Paraphrase when you want to show you understand an idea and can explain it in your own words. This is the most common method in academic writing.<\/p><p>For example, when writing about a research study, you can paraphrase the findings to fit your essay’s style and flow.<\/p>"}, {"h": "When to summarize", "p": "<p>Summarize when you need to give the main point or overall result of a study or argument. Summaries are shorter and focus on the big picture.<\/p><p>For example, you might summarize a long article about Saudi tourism by stating its main conclusion in one or two sentences.<\/p>"}]}, {"t": "mc", "q": "When should you paraphrase instead of quoting?", "multi": false, "fb": "", "answers": [{"h": "When the exact words are important", "c": false, "f": "Use a quote when the exact words matter, not paraphrasing."}, {"h": "When you want to show you understand the idea", "c": true, "f": "Paraphrasing shows you understand the idea by putting it in your own words."}, {"h": "When you cannot think of anything to write", "c": false, "f": "Paraphrasing is not meant for filling space or when you lack ideas."}, {"h": "When you want to copy and paste quickly", "c": false, "f": "Copy-pasting is not paraphrasing and does not demonstrate understanding."}]}, {"t": "cont"}, {"t": "image", "img": "three-ways", "cap": ""}, {"t": "text", "h": "Why Citing Sources Is Essential", "p": "<p>Citation means giving credit to the authors of the information you use. Whether you quote, paraphrase, or summarize, you must always cite your sources. This builds trust with your teachers and helps you avoid plagiarism by showing exactly where your ideas come from.<\/p>"}, {"t": "text", "h": "Types of Citation Flashcards", "p": "<p>Click each card to learn about different types of citation.<\/p>"}, {"t": "flash", "cards": [{"f": "<p>In-text citation<\/p>", "b": "<p>A short note in your writing that shows where an idea or quote comes from, usually in parentheses.<\/p>"}, {"f": "<p>Reference list<\/p>", "b": "<p>A list at the end of your assignment that gives full details of all sources you used.<\/p>"}, {"f": "<p>When to cite<\/p>", "b": "<p>You must cite whenever you use someone else’s words, ideas, or research in your work.<\/p>"}, {"f": "<p>Common citation mistakes<\/p>", "b": "<p>Forgetting to cite, using the wrong format, or missing important details about the source.<\/p>"}]}, {"t": "mc", "q": "Why do you need to cite sources when paraphrasing?", "multi": false, "fb": "", "answers": [{"h": "To show you have read a lot", "c": false, "f": "Citing is not about showing how much you have read; it is about giving credit to original sources."}, {"h": "To give credit and avoid plagiarism", "c": true, "f": "Citation gives credit to the original author and helps you avoid plagiarism."}, {"h": "To make your work look longer", "c": false, "f": "Citation is not intended to make your work appear longer."}, {"h": "To confuse the reader", "c": false, "f": "Citation should make your work clearer, not more confusing."}]}, {"t": "note", "p": "<p>Remember: Every time you use someone else’s idea—whether you quote, paraphrase, or summarize—you must include a citation.<\/p>"}, {"t": "cont"}, {"t": "text", "h": "", "p": "<p>In this lesson, you learned what paraphrasing is, why it is important for academic honesty, and how to tell the difference between quoting, paraphrasing, and summarizing. You also saw why you must always cite your sources. In the next lesson, you’ll discover step-by-step strategies to paraphrase sentences and short passages in your own words.<\/p>"}]}, {"title": "How to Paraphrase: Step-by-Step Strategies", "blocks": [{"t": "banner", "img": "l2-banner", "cap": ""}, {"t": "text", "h": "How Paraphrasing Helps You Write Better", "p": "<p>Paraphrasing is a key academic skill that allows you to truly understand information and express it in your own words. By learning to paraphrase, you become a stronger, more independent writer - an essential ability for success in university assignments and research.<\/p>"}, {"t": "text", "h": "", "p": "<p>In this lesson, you will discover essential techniques to effectively paraphrase sentences and passages. Mastering these skills will help you express ideas in your own words while maintaining the original meaning.<\/p>"}, {"t": "list", "items": ["<p>Simple steps to paraphrase any sentence or short passage<\/p>", "<p>How to use synonyms and change word forms<\/p>", "<p>Ways to change sentence structure<\/p>", "<p>How to use active and passive voice in paraphrasing<\/p>", "<p>How to spot and fix paraphrases that are too close to the original<\/p>"]}, {"t": "cont"}, {"t": "text", "h": "The Simple Paraphrasing Process", "p": "<p>To paraphrase well, start with a clear process. First, read the sentence until you fully understand it. Next, cover or hide the original so you are not tempted to copy. Finally, write the idea in your own words, then check your version for accuracy and add the citation.<\/p>"}, {"t": "process", "steps": [{"k": "intro", "h": "Introduction to Paraphrasing Steps", "p": "<p>Paraphrasing is an important skill that involves expressing ideas from a source in your own words. To do this effectively, follow a structured process each time you paraphrase.<\/p>"}, {"k": "step", "h": "Read and Understand", "p": "<p>Carefully read the sentence or passage until you fully grasp its meaning. If you encounter unfamiliar words, look them up to ensure complete understanding.<\/p>"}, {"k": "step", "h": "Cover the Original Text", "p": "<p>Hide the original text so you cannot see it. This prevents you from unintentionally copying the same words or sentence structure.<\/p>"}, {"k": "step", "h": "Write in Your Own Words", "p": "<p>From memory, write the idea using your own words. Afterwards, compare your version with the original to confirm you have preserved the meaning, and remember to include the correct citation.<\/p>"}, {"k": "summary", "h": "Summary of Paraphrasing Process", "p": "<p>By reading and understanding the original, covering it to avoid direct copying, and then writing the idea in your own words, you can paraphrase accurately and ethically. Always check your work to ensure the meaning is retained and cite the source properly.<\/p>"}]}, {"t": "mc", "q": "Which is the correct first step in paraphrasing?", "multi": false, "fb": "", "answers": [{"h": "Change a few words in the original", "c": false, "f": "Paraphrasing is not just changing words; it requires a deeper understanding and restatement of the idea."}, {"h": "Read and understand the original sentence", "c": true, "f": "Always start by understanding the original sentence. This ensures your paraphrase accurately reflects the original meaning."}, {"h": "Cover the citation", "c": false, "f": "You should focus on understanding and restating the full sentence, not just the citation."}, {"h": "Write your own opinion", "c": false, "f": "Paraphrasing is about restating someone else's idea, not expressing your own opinion."}]}, {"t": "cont"}, {"t": "text", "h": "Using Synonyms and Changing Word Forms", "p": "A strong paraphrase uses different words and sometimes different word forms. This means replacing key words with synonyms and, when possible, changing verbs to nouns or vice versa. These changes help make your writing original and clear."}, {"t": "text", "h": "Paraphrasing: Changing Words", "p": "<p>Click each card to see how you can change words when paraphrasing.<\/p>"}, {"t": "flash", "cards": [{"f": "<p>Synonym for “capacity”<\/p>", "b": "<p>You can use “ability” or “facility” instead of “capacity.”<\/p>"}, {"f": "<p>Synonym for “retrieving”<\/p>", "b": "<p>Try “recovering” or “accessing” as synonyms for “retrieving.”<\/p>"}, {"f": "<p>Change “grew” to “growth”<\/p>", "b": "<p>Change the verb “grew” to the noun “growth” for a new sentence structure.<\/p>"}, {"f": "<p>Synonym for “information”<\/p>", "b": "<p>Use “data” or “details” instead of “information.”<\/p>"}]}, {"t": "mc", "q": "Which sentence uses a synonym and changes the word form?", "multi": false, "fb": "", "answers": [{"h": "Tourism grew quickly after 2021.", "c": false, "f": "This sentence does not change the word form; 'grew' is still a verb."}, {"h": "Rapid growth in tourism followed 2021.", "c": true, "f": "This sentence changes 'grew' (verb) to 'growth' (noun), and uses 'rapid' as a synonym for 'quickly.'"}, {"h": "Tourism increased fast after 2021.", "c": false, "f": "This sentence uses a synonym ('increased' for 'grew'), but does not change the word form."}, {"h": "Tourism grew after 2021, according to the report.", "c": false, "f": "This sentence does not use a synonym or change the word form."}]}, {"t": "cont"}, {"t": "image", "img": "puzzle", "cap": ""}, {"t": "text", "h": "Changing the Structure of a Sentence", "p": "<p>Paraphrasing is not just about swapping words -it often means changing how a sentence is built. You can put the result first, split a long sentence into two, or combine ideas in a new way. These changes make your writing unique and help you avoid plagiarism.<\/p>"}, {"t": "text", "h": "Five Ways to Change a Sentence When Paraphrasing", "p": "<p>Paraphrasing is more than just swapping words for synonyms. Here are five effective techniques to help you rewrite sentences in your own words while keeping the original meaning.<\/p>"}, {"t": "acc", "items": [{"h": "Put the result first", "p": "<p>Start your sentence with the outcome instead of the original subject. For example, instead of “Researchers surveyed 400 students and found that most used AI tools,” write “Most students used AI tools, a survey of 400 found.”<\/p><p>This change highlights the result and makes the sentence your own.<\/p>"}, {"h": "Turn a verb into a noun", "p": "<p>Change action words into nouns to create a new structure. For example, “Tourism grew quickly after 2021” becomes “Rapid growth in tourism followed 2021.”<\/p><p>This makes your sentence shorter and more original.<\/p>"}, {"h": "Split one sentence into two", "p": "<p>Break a long sentence into two shorter ones. For example, “Arrivals reached 1.4 billion in 2024, driven mainly by small island destinations” becomes “Arrivals reached 1.4 billion in 2024. Small island destinations drove most of that rise.”<\/p><p>This helps make complex ideas clearer.<\/p>"}, {"h": "Switch between active and passive voice", "p": "<p>Change who does the action in the sentence. “Tourists damage shallow reefs” (active) can become “Shallow reefs are damaged by tourists” (passive).<\/p><p>This lets you shift focus as needed.<\/p>"}, {"h": "Start from the condition or time", "p": "<p>Begin your sentence with a time or condition. For example, “Coral recovers if water temperatures fall” becomes “When water temperatures fall, coral recovers.”<\/p><p>This gives your writing variety and clarity.<\/p>"}]}, {"t": "mc", "q": "Which sentence shows a change in structure, not just words?", "multi": false, "fb": "", "answers": [{"h": "The 2023 heatwave caused coral bleaching to rise.", "c": false, "f": ""}, {"h": "Coral bleaching rose after the 2023 heatwave.", "c": false, "f": ""}, {"h": "Coral bleaching increased sharply after the 2023 heatwave.", "c": false, "f": ""}, {"h": "After the 2023 heatwave, coral bleaching rose sharply.", "c": true, "f": ""}]}, {"t": "cont"}, {"t": "text", "h": "Active and Passive Voice in Paraphrasing", "p": "Active and passive voice are two ways to show who does an action in a sentence. In the active voice, the subject does the action. In the passive voice, the subject receives the action. Knowing how to use both helps you paraphrase more flexibly and focus on what matters most in your writing."}, {"t": "text", "h": "Compare Active and Passive Voice", "p": "<p>Click each tab to compare active and passive voice.<\/p>"}, {"t": "tabs", "items": [{"h": "Active Voice", "p": "<p>In active voice, the subject of the sentence does the action. For example, “Researchers collected the data in 2023.” This structure is clear and direct, making it easy for readers to see who is responsible.<\/p><p>Active voice is often used in academic writing when you want to highlight the person or group who performed the action, such as in research reports or analysis.<\/p>"}, {"h": "Passive Voice", "p": "<p>In passive voice, the subject receives the action, and the doer may not be mentioned. For example, “The data were collected in 2023.” This structure focuses on the action or result, not the person who did it.<\/p><p>Passive voice is useful in scientific writing or when the process is more important than the actor. It can also be used to avoid assigning blame or responsibility.<\/p>"}, {"h": "When to Use", "p": "<p>Choose active voice when you want to be clear about who did what, especially in your own analysis or claims. Use passive voice when the action or result is more important than the person doing it, or when the doer is unknown or unimportant.<\/p><p>For example, in a Saudi university research project, you might write “The experiment was conducted in Riyadh” (passive) or “The students conducted the experiment in Riyadh” (active), depending on what you want to emphasize.<\/p>"}]}, {"t": "mc", "q": "Which sentence is in the passive voice?", "multi": false, "fb": "", "answers": [{"h": "Tourists visit Saudi Arabia every year.", "c": false, "f": ""}, {"h": "Saudi Arabia is visited by many tourists every year.", "c": true, "f": ""}, {"h": "Many tourists like visiting Saudi Arabia.", "c": false, "f": ""}, {"h": "Tourists enjoy Saudi Arabian food.", "c": false, "f": ""}]}, {"t": "cont"}, {"t": "image", "img": "compare-docs", "cap": ""}, {"t": "text", "h": "How Close Is Too Close? Avoiding Near-Copying", "p": "<p>Paraphrasing is not just about changing a few words or swapping their order. If your version is too similar to the original, it can still count as plagiarism. You must change both the words and the structure to make the idea truly your own.<\/p>"}, {"t": "text", "h": "Sort Paraphrase Examples", "p": "<p>Decide whether each example is a real paraphrase or too close to the original. Consider both the wording and the sentence structure.<\/p>"}, {"t": "sort", "piles": ["Real Paraphrase", "Too Close"], "cards": [{"h": "Small island destinations accounted for much of the growth that took global arrivals to 1.4 billion in 2024.", "p": 0}, {"h": "International tourist numbers hit 1.4 billion in 2024, a rise driven mostly by small island locations.", "p": 1}, {"h": "Most of 400 students surveyed had used AI tools.", "p": 0}, {"h": "Researchers questioned 400 students and found most had used AI tools.", "p": 1}]}, {"t": "note", "p": "<p>Remember: A true paraphrase involves altering both the vocabulary and the sentence structure. If you need to refer to the original text while writing your version, your paraphrase is likely not different enough.<\/p>"}, {"t": "cont"}, {"t": "text", "h": "", "p": "<p>In this lesson, you learned step-by-step strategies to paraphrase sentences and short passages, how to use synonyms and change sentence structure, and how to avoid paraphrases that are too close to the original. Next, you’ll practice paraphrasing with real examples and learn how to add proper citations to your writing.<\/p>"}]}, {"title": "Citing Sources and Practicing Paraphrasing", "blocks": [{"t": "banner", "img": "l3-banner", "cap": ""}, {"t": "text", "h": "Why Citation and Practice Make You a Strong Academic Writer", "p": "<p>Citing your sources correctly and practicing paraphrasing are essential skills for every university student. When you give credit to the original authors and use your own words, you build trust with your teachers and show that you truly understand the material. These habits help you avoid plagiarism and demonstrate your honesty and effort in academic writing.<\/p>"}, {"t": "text", "h": "", "p": "<p>This lesson will guide you through essential skills for properly citing sources when paraphrasing. You will learn the basics of citation, how to add citations to your writing, avoid common mistakes, paraphrase effectively, and check your work for accuracy.<\/p>"}, {"t": "list", "items": ["<p>Basics of Citing When Paraphrasing<\/p>", "<p>How to Add Citations to Sentences<\/p>", "<p>Avoiding Common Citation Mistakes<\/p>", "<p>Paraphrasing from Notes and Memory<\/p>", "<p>Checking Your Work for Accuracy<\/p>"]}, {"t": "cont"}, {"t": "text", "h": "Citation Basics: Giving Credit When You Paraphrase", "p": "<p>Every time you paraphrase or summarize, you must include a citation. This is because the idea or information belongs to someone else, even if you use your own words. Giving credit is a basic rule in academic writing and shows respect for the original author’s work.<\/p>"}, {"t": "text", "h": "Citing Sources When Paraphrasing", "p": "<p>Click each row to learn about citing sources when paraphrasing.<\/p>"}, {"t": "acc", "items": [{"h": "Why you must cite", "p": "<p>Citing sources is required because it shows honesty and respect for the original author. It also lets your teachers see where your information comes from and helps you avoid plagiarism.<\/p>"}, {"h": "What information goes in a citation", "p": "<p>A citation usually includes the author’s last name and the year of publication. If you use a direct quote, add the page number too.<\/p>"}, {"h": "Where to put the citation", "p": "<p>Place the citation at the end of your paraphrased or summarized sentence, inside parentheses. This makes it clear which idea comes from which source.<\/p>"}, {"h": "What happens if you forget", "p": "<p>If you forget to cite, you risk plagiarism, which can lead to lost marks or even more serious consequences at university.<\/p>"}]}, {"t": "mc", "q": "Which sentence correctly uses a citation after a paraphrase?", "multi": false, "fb": "", "answers": [{"h": "Tourism grew quickly after 2021.", "c": false, "f": "This sentence does not include any citation, so it does not properly credit the source."}, {"h": "Tourism grew quickly after 2021 (Ahmed, 2024).", "c": true, "f": "This sentence correctly uses a parenthetical citation with the author's name and year, which is the standard format."}, {"h": "Tourism grew quickly after 2021 (see reference).", "c": false, "f": "'See reference' is not a proper citation format and does not specify the source."}, {"h": "Tourism grew quickly after 2021, said by Ahmed.", "c": false, "f": "This is not the standard citation format; it does not include the year or use parentheses."}]}, {"t": "cont"}, {"t": "image", "img": "cited-paraphrase", "cap": ""}, {"t": "text", "h": "Common Citation Mistakes (And How to Avoid Them)", "p": "<p>Many students make simple mistakes with citations, such as forgetting to add them after paraphrasing, using the wrong format, or citing the wrong source. You can avoid these errors by double-checking your work, following your university’s citation style, and always adding a citation when you use someone else’s ideas.<\/p>"}, {"t": "text", "h": "Common Citation Errors", "p": "<p>Click each tab to learn about common citation errors.<\/p>"}, {"t": "tabs", "items": [{"h": "Missing citation", "p": "<p>One of the most common mistakes is leaving out a citation after paraphrasing or summarizing. This can happen if you forget where your information came from or think it is common knowledge.<\/p><p>To avoid this, always keep track of your sources as you take notes. If you are unsure, add a citation to be safe.<\/p>"}, {"h": "Wrong citation format", "p": "<p>Using the wrong format, such as missing the year or putting the citation in the wrong place, can confuse your reader and lower your marks.<\/p><p>Check your university’s guidelines for how to write citations. Practice using the correct format until it becomes a habit.<\/p>"}, {"h": "Citing the wrong source", "p": "<p>Sometimes students accidentally give credit to the wrong author or mix up sources. This can make your work look careless or dishonest.<\/p><p>Always double-check your notes and match each idea to the correct source before you write your final draft.<\/p>"}, {"h": "Forgetting to cite summaries", "p": "<p>Even when you summarize a whole article or study, you must still include a citation. Some students forget this because they think summarizing is different from paraphrasing.<\/p><p>Remember: any time you use someone else’s ideas, whether you paraphrase or summarize, you must give credit.<\/p>"}]}, {"t": "mc", "q": "Which of the following is a common citation mistake?", "multi": false, "fb": "", "answers": [{"h": "Including the author and year after a paraphrase", "c": false, "f": "This is correct citation practice and not a mistake."}, {"h": "Using your own words and adding a citation", "c": false, "f": "This is good paraphrasing and citation, not a mistake."}, {"h": "Forgetting to cite the source after paraphrasing", "c": true, "f": "Missing the citation after paraphrasing is a common error and is considered a citation mistake."}, {"h": "Summarizing and giving credit to the author", "c": false, "f": "This is proper summarizing and citing, not a mistake."}]}, {"t": "cont"}, {"t": "text", "h": "Practice: Paraphrasing from Notes and Memory", "p": "<p>Paraphrasing from notes or memory encourages you to express ideas in your own words, rather than duplicating the source material. This approach enhances the originality of your writing and minimizes the chances of accidental plagiarism. Additionally, it deepens your understanding of the subject and strengthens your academic abilities.<\/p>"}, {"t": "process", "steps": [{"k": "intro", "h": "Introduction to Paraphrasing from Notes or Memory", "p": "<p>Paraphrasing is an essential skill for academic writing and studying. It involves expressing information from a source in your own words while retaining the original meaning. Follow these steps to effectively paraphrase from notes or memory.<\/p>"}, {"k": "step", "h": "Read and Understand the Main Idea", "p": "<p>Start by reading the original text or your notes carefully. Make sure you fully understand the main idea and any important details.<\/p>"}, {"k": "step", "h": "Cover or Close the Source", "p": "<p>Once you understand the information, close the book, tab, or notes so you cannot see the original words.<\/p>"}, {"k": "step", "h": "Write in Your Own Words", "p": "<p>Write the idea using your own sentence structure and vocabulary. Keep key facts and specialist terms the same if needed.<\/p>"}, {"k": "step", "h": "Add the Citation", "p": "<p>At the end of your paraphrased sentence, include the correct citation to give credit to the original source.<\/p>"}, {"k": "step", "h": "Check for Accuracy and Structure", "p": "<p>Review your paraphrase to make sure it is accurate, uses your own words and structure, and includes the citation.<\/p>"}, {"k": "summary", "h": "Summary of Paraphrasing Steps", "p": "<p>By following these steps - understanding the main idea, covering the source, writing in your own words, adding a citation, and checking your work - you can paraphrase effectively and ethically from notes or memory.<\/p>"}]}, {"t": "mc", "q": "What should you do after writing your paraphrase from notes?", "multi": false, "fb": "", "answers": [{"h": "Add your own opinion", "c": false, "f": "Your opinion should be included later during analysis, not immediately after paraphrasing."}, {"h": "Check your paraphrase for accuracy and add the citation", "c": true, "f": "You should always check your paraphrase for accuracy and include the citation to give proper credit."}, {"h": "Copy the original text again", "c": false, "f": "You should not copy the original text again; paraphrasing requires you to use your own words."}, {"h": "Leave out specialist terms", "c": false, "f": "Specialist terms should be kept unchanged when necessary to maintain accuracy."}]}, {"t": "cont"}, {"t": "image", "img": "from-memory", "cap": ""}, {"t": "text", "h": "Self-Check: Is Your Paraphrase Original and Accurate?", "p": "<p>Before you finish, ask yourself: Did I use my own sentence structure? Did I keep the meaning of the original? Did I include a citation? These questions help you make sure your paraphrase is honest, accurate, and ready for university assignments.<\/p>"}, {"t": "text", "h": "Sort the Self-Check Statements for Paraphrasing", "p": "<p>Review the following statements and sort them into the correct categories: Good Self-Check or Not a Self-Check. Consider whether each statement helps you evaluate the quality and originality of your paraphrase.<\/p>"}, {"t": "sort", "piles": ["Good Self-Check", "Not a Self-Check"], "cards": [{"h": "Did I change the sentence structure?", "p": 0}, {"h": "Did I use my own words?", "p": 0}, {"h": "Did I add a citation?", "p": 0}, {"h": "Did I copy most of the original?", "p": 1}]}, {"t": "note", "p": "<p>Remember: Whenever you paraphrase or summarize information, make sure to use your own wording and sentence structure, and always include a citation.<\/p>"}, {"t": "cont"}, {"t": "text", "h": "", "p": "<p>In this lesson, you learned how to cite sources when paraphrasing and summarizing, how to avoid common citation mistakes, and how to practice paraphrasing from notes and memory. Next, you’ll review all the key skills from this course and get ready for the final quiz.<\/p>"}]}, {"title": "Review and Practice: Paraphrasing and Citation", "blocks": [{"t": "banner", "img": "l4-banner", "cap": ""}, {"t": "text", "h": "Bringing It All Together: Why Review Matters", "p": "<p>Reviewing and practicing your academic writing skills is the best way to feel confident and prepared for university assignments. In this lesson, you will bring together everything you have learned about paraphrasing, summarizing, quoting, and citing sources. This review will help you check your understanding and get ready for the final quiz.<\/p>"}, {"t": "text", "h": "", "p": "<p>In this lesson, you will review and practice several important skills related to paraphrasing and academic integrity.<\/p>"}, {"t": "list", "items": ["<p>What paraphrasing is and why it matters<\/p>", "<p>How to tell quoting, paraphrasing, and summarizing apart<\/p>", "<p>Ways to change sentence structure and word forms<\/p>", "<p>How to cite sources correctly<\/p>", "<p>How to check your own work for originality and honesty<\/p>"]}, {"t": "cont"}, {"t": "image", "img": "review-notes", "cap": ""}, {"t": "text", "h": "Reviewing Paraphrasing: The Key Ideas", "p": "<p>Paraphrasing means saying someone else’s point accurately in your own words. You use paraphrasing to show you understand a source and to avoid copying. The most important rule: change both the words and the structure of the sentence, and always include a citation to give credit.<\/p>"}, {"t": "text", "h": "Essentials of Paraphrasing", "p": "<p>Click each card to review the essentials of paraphrasing.<\/p>"}, {"t": "flash", "cards": [{"f": "<p>What is paraphrasing?<\/p>", "b": "<p>Restating someone else’s idea in your own words and sentence structure.<\/p>"}, {"f": "<p>Why paraphrase?<\/p>", "b": "<p>To show understanding, avoid plagiarism, and build your own academic voice.<\/p>"}, {"f": "<p>What must change?<\/p>", "b": "<p>Both the words and the sentence structure must be different from the original.<\/p>"}, {"f": "<p>What must stay the same?<\/p>", "b": "<p>The meaning of the idea and any key facts or specialist terms.<\/p>"}, {"f": "<p>When do you need to cite?<\/p>", "b": "<p>Every time you use someone else’s idea, whether you paraphrase, quote, or summarize.<\/p>"}]}, {"t": "mc", "q": "Which is required for a good paraphrase?", "multi": false, "fb": "", "answers": [{"h": "Change a few words only", "c": false, "f": "Incorrect. You must also change the structure, not just a few words."}, {"h": "Change words and structure, and add a citation", "c": true, "f": "Correct! Both the words and sentence structure must change, and you must cite."}, {"h": "Copy the sentence and add a citation", "c": false, "f": "Incorrect. Copying is not paraphrasing."}, {"h": "Use your own opinion only", "c": false, "f": "Incorrect. Paraphrasing is about restating someone else’s idea, not just giving your own opinion."}]}, {"t": "cont"}, {"t": "text", "h": "Quote, Paraphrase, or Summarize? Know the Difference", "p": "<p>It’s important to know the difference between quoting, paraphrasing, and summarizing. Quoting uses the exact words from a source with quotation marks. Paraphrasing restates one point in your own words and structure. Summarizing condenses the main idea into a shorter form. Remember, all three require a citation to give credit to the original author.<\/p>"}, {"t": "text", "h": "Sort Quotes, Paraphrases, and Summaries", "p": "<p>Sort each example below as a quote, paraphrase, or summary. Consider how each example uses the original information: does it use the exact words, restate the idea in new words, or just give the main point?<\/p>"}, {"t": "sort", "piles": ["Quote", "Paraphrase", "Summary"], "cards": [{"h": "“Tourism grew quickly after 2021.” (with quotation marks)", "p": 0}, {"h": "Tourism increased rapidly after 2021. (own words, same detail)", "p": 1}, {"h": "Tourism rose after 2021, according to Ahmed (2024). (main point only)", "p": 2}]}, {"t": "mc", "q": "Which statement is a summary?", "multi": false, "fb": "", "answers": [{"h": "“Tourism increased rapidly after 2021.”", "c": false, "f": "This is a paraphrase, not a summary. It restates information in different words but does not condense the main point from a source."}, {"h": "“Tourism rose after 2021, according to Ahmed (2024).”", "c": true, "f": "This is a summary because it condenses the main point from a source and attributes it, capturing the essential idea."}, {"h": "“Tourism grew quickly after 2021.” (with quotation marks)", "c": false, "f": "This is a direct quote, not a summary. It uses the exact words from the source."}, {"h": "“Tourism in Saudi Arabia is important for the economy.”", "c": false, "f": "This is a general opinion and does not summarize a specific source or main point."}]}, {"t": "cont"}, {"t": "text", "h": "Practice: Changing Sentence Structure and Word Forms", "p": "<p>A strong paraphrase often means changing how a sentence is built. You can move information to a different place, switch word forms (like turning a verb into a noun), or split or combine sentences. Always keep the meaning and remember to add a citation.<\/p>"}, {"t": "text", "h": "Ways to Change a Sentence When Paraphrasing", "p": "<p>There are many ways to change a sentence when paraphrasing. Explore each method below and see a simple example for each. These strategies help you create original sentences while keeping the meaning the same.<\/p>"}, {"t": "acc", "items": [{"h": "Put the result first", "p": "<p>Move the outcome to the start of the sentence. Example: Most students used AI tools, a survey of 400 found.<\/p>"}, {"h": "Change a verb into a noun", "p": "<p>Switch the action word to a noun. Example: Rapid growth in tourism followed 2021.<\/p>"}, {"h": "Split one sentence into two", "p": "<p>Break a long sentence into two shorter ones. Example: Arrivals reached 1.4 billion in 2024. Small island destinations drove most of that rise.<\/p>"}, {"h": "Switch between active and passive voice", "p": "<p>Change who does the action. Example: Tourists damage shallow reefs. Shallow reefs are damaged by tourists.<\/p>"}, {"h": "Start from the condition or time", "p": "<p>Begin the sentence with when or if something happens. Example: When water temperatures fall, coral recovers.<\/p>"}]}, {"t": "mc", "q": "Which option shows a change in sentence structure?", "multi": false, "fb": "", "answers": [{"h": "A. Coral bleaching rose sharply after the 2023 heatwave.", "c": false, "f": "This sentence maintains the same structure as the original; only the wording is slightly different."}, {"h": "B. After the 2023 heatwave, coral bleaching rose sharply.", "c": true, "f": "This sentence changes the structure by starting with the time phrase, altering the sentence order."}, {"h": "C. Coral bleaching increased after the 2023 heatwave.", "c": false, "f": "This sentence only uses a synonym ('increased' instead of 'rose'), but the structure remains the same."}, {"h": "D. Coral bleaching rose after the 2023 heatwave.", "c": false, "f": "This sentence is structurally the same as the original, with only a minor change in wording."}]}, {"t": "cont"}, {"t": "image", "img": "highlight-citation", "cap": ""}, {"t": "text", "h": "Citing Sources and Checking Your Work", "p": "<p>Every time you paraphrase, quote, or summarize, you must include a citation to give credit to the original author. Before submitting your assignments, check that you have cited all sources and that your work uses your own words and structure. This helps you avoid plagiarism and shows your honesty as a student.<\/p>"}, {"t": "text", "h": "Sort the Self-Check Statements for Academic Writing", "p": "<p>Review each statement and decide if it is a good self-check for your academic writing. Good self-checks help ensure your work is original and properly cited, while not a self-check includes practices to avoid.<\/p>"}, {"t": "sort", "piles": ["Good Self-Check", "Not a Self-Check"], "cards": [{"h": "Did I use my own sentence structure?", "p": 0}, {"h": "Did I add a citation?", "p": 0}, {"h": "Did I copy most of the original?", "p": 1}, {"h": "Did I keep the meaning accurate?", "p": 0}]}, {"t": "mc", "q": "Why should you always add a citation when paraphrasing or summarizing?", "multi": false, "fb": "", "answers": [{"h": "To make your work look longer", "c": false, "f": "Citation is not intended to increase the length of your work."}, {"h": "To give credit and avoid plagiarism", "c": true, "f": "Citing sources gives credit to the original author and helps you avoid plagiarism."}, {"h": "To confuse the reader", "c": false, "f": "Citations are meant to clarify your sources, not confuse the reader."}, {"h": "To repeat the original words", "c": false, "f": "Paraphrasing means using your own words, not repeating the original text."}]}, {"t": "note", "p": "<p>Remember: The best academic writing uses your own words and structure, always gives credit, and checks for honesty before submitting.<\/p>"}, {"t": "cont"}, {"t": "text", "h": "", "p": "<p>In this lesson, you reviewed all the key skills for paraphrasing, summarizing, quoting, changing sentences, and citing sources. You practiced checking your work for originality and honesty. Now you’re ready to take the final quiz and show you can use these skills in your university studies.<\/p>"}]}, {"title": "Quiz: Paraphrasing and Citation Skills", "blocks": [{"t": "banner", "img": "l5-banner", "cap": ""}, {"t": "text", "h": "Test Your Skills: Are You Ready for Academic Writing?", "p": "<p>Congratulations on reaching the final lesson of this course! This quiz will help you check your understanding of paraphrasing, citation, and related academic writing skills. Completing this quiz will show you how ready you are for university assignments and help you feel confident in your ability to write honestly and effectively.<\/p>"}, {"t": "text", "h": "", "p": "<p>This quiz will help you check your understanding of key concepts related to using sources in your writing.<\/p>"}, {"t": "list", "items": ["<p>Tell the difference between quoting, paraphrasing, and summarizing.<\/p>", "<p>Recognize and create strong paraphrases.<\/p>", "<p>Apply rules for citing sources.<\/p>", "<p>Avoid plagiarism and common mistakes.<\/p>"]}, {"t": "cont"}, {"t": "mc", "q": "Which sentence is a real paraphrase and NOT too close to the original?", "multi": false, "fb": "", "answers": [{"h": "A. International tourist arrivals reached 1.4 billion in 2024, an increase driven largely by small island destinations (UN Tourism, 2025).", "c": false, "f": "This is a direct copy of the original sentence, so it is not a true paraphrase."}, {"h": "B. International tourist numbers hit 1.4 billion in 2024, a rise driven mostly by small island locations (UN Tourism, 2025).", "c": false, "f": "This option only swaps a few words and keeps the same structure as the original, making it too close to be a real paraphrase."}, {"h": "C. Small island destinations accounted for much of the growth that took global arrivals to 1.4 billion in 2024 (UN Tourism, 2025).", "c": true, "f": "This sentence changes both the structure and wording of the original, making it a genuine paraphrase."}, {"h": "D. The number of international tourists was 1.4 billion in 2024, mainly due to small island destinations (UN Tourism, 2025).", "c": false, "f": "This option is still too close in structure and detail to the original sentence."}]}, {"t": "mc", "q": "Which of the following is an example of plagiarism?", "multi": false, "fb": "", "answers": [{"h": "Paraphrasing a source with a citation", "c": false, "f": "Paraphrasing a source and providing a citation is not plagiarism because you are giving proper credit to the original author."}, {"h": "Copying a paragraph and not giving credit", "c": true, "f": "Copying someone else's work without giving credit is plagiarism because you are presenting someone else's ideas or words as your own."}, {"h": "Summarizing a study in your own words and citing it", "c": false, "f": "Summarizing in your own words and providing a citation is not plagiarism, as you are acknowledging the original source."}, {"h": "Writing your own opinion on a topic", "c": false, "f": "Writing your own opinion is not plagiarism because the ideas are your own and not taken from another source."}]}, {"t": "mc", "q": "What must you always include when you paraphrase or summarize a source?", "multi": false, "fb": "", "answers": [{"h": "Your own opinion about the idea", "c": false, "f": "Your opinion is not required in a paraphrase or summary. You should focus on accurately representing the source's ideas."}, {"h": "The page number only", "c": false, "f": "You need more than just the page number. Proper citation requires more information."}, {"h": "A citation with the author and year", "c": true, "f": "Always include a citation with the author and year when paraphrasing or summarizing to give proper credit to the source."}, {"h": "The exact words from the source", "c": false, "f": "Paraphrasing and summarizing use your own words, not the exact words from the source."}]}, {"t": "mc", "q": "Which option shows a change in sentence structure (not just words)?", "multi": false, "fb": "", "answers": [{"h": "A. Arrivals reached 1.4 billion in 2024. Small island destinations drove most of that rise (Ahmed, 2024).", "c": true, "f": "This option splits the original sentence into two separate sentences, changing the structure."}, {"h": "B. Arrivals reached 1.4 billion in 2024, a rise driven mainly by small island destinations (Ahmed, 2024).", "c": false, "f": "This option keeps the original sentence structure, only rephrasing slightly."}, {"h": "C. Arrivals hit 1.4 billion in 2024, a rise driven mainly by small islands (Ahmed, 2024).", "c": false, "f": "This option only changes some words, not the sentence structure."}, {"h": "D. Arrivals reached 1.4 billion in 2024, driven mainly by small island destinations (Ahmed, 2024).", "c": false, "f": "This option maintains the original sentence structure, with minor wording changes."}]}, {"t": "mc", "q": "Which statement is a summary?", "multi": false, "fb": "", "answers": [{"h": "“Tourism grew quickly after 2021.” (with quotation marks)", "c": false, "f": ""}, {"h": "Tourism increased rapidly after 2021.", "c": false, "f": ""}, {"h": "Tourism rose after 2021, according to Ahmed (2024).", "c": true, "f": ""}, {"h": "Tourism is important const BAND = {

  flash:["Activity","Flashcards","Tap a card to turn it over."],
  process:["Activity","Step by step","Work through each step in order."],

function band(kind, inner){

let uid = 0;
function blockHTML(b){
  const id = "b"+(++uid);
  switch(b.t){
    case "banner": return `<div class="wide">${fig(b.img,"banner",b.cap)}</div>`;
    case "image": return fig(b.img,"",b.cap);

    case "acc": return `<div class="acc">${b.items.map(x=>`<details><summary>${esc(x.h)}</summary><div class="prose">${x.p}</div></details>`).join("")}</div>`;
    case "mc": return band(b.multi?"mcm":"mc",`<div class="act" data-kind="mc" id="${id}"></div>`);

    case "tabs": return `<div class="tabs"><div class="tablist" role="tablist">${b.items.map((x,i)=>`<button role="tab" id="${id}-t${i}" aria-controls="${id}-p${i}" aria-selected="${i===0}" tabindex="${i===0?0:-1}">${esc(x.h)}</button>`).join("")}</div>${b.items.map((x,i)=>`<div class="tabpanel" role="tabpanel" id="${id}-p${i}" aria-labelledby="${id}-t${i}" ${i?"hidden":""}><div class="prose">${x.p}</div></div>`).join("")}</div>`;
    case "flash": return band("flash",`<div class="act"><div class="cards">${b.cards.map(c=>`<button class="flash" aria-pressed="false"><span class="in"><span class="face front"><small>Term</small>${c.f}</span><span class="face back"><small>Meaning</small>${c.b}</span></span></button>`).join("")}</div></div>`);

function mountMC(el, b, opts){
  opts = opts || {};
  let pick = b.multi ? new Set() : null, checked = false, ok = false;
  const isOn = i => b.multi ? pick.has(i) : pick===i;
  const any = () => b.multi ? pick.size>0 : pick!=null;
  const draw = () => {
    let fbText = "";
    if(checked){ fbText = (!b.multi && b.answers[pick].f) || b.fb || ""; }
    el.innerHTML = `${opts.label?`<div class="label">${opts.label}</div>`:""}<div class="q">${b.q}</div>
      <div class="choices" role="${b.multi?"group":"radiogroup"}">${b.answers.map((x,i)=>{
        let cls=""; if(checked){ if(isOn(i)) cls = x.c?" right":" wrong"; else if(opts.reveal && x.c) cls=" right"; }
        return `<button class="choice${cls}" role="${b.multi?"checkbox":"radio"}" aria-checked="${isOn(i)}" data-i="${i}" ${checked?"disabled":""}>${b.multi?`<span class="box">${isOn(i)?"✓":""}</span>`:`<span class="dot"></span>`}<span>${x.h}</span></button>`;}).join("")}</div>
      ${checked?`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Correct":"Not quite"}</b>${fbText?`<div>${fbText}</div>`:(!ok&&!opts.reveal?`<div>Have another look and try again.</div>`:"")}</div>`:""}
      <div class="btnrow">${checked
        ? (opts.onNext ? `<button class="btn" data-act="next">${opts.nextLabel||"Next"}</button>` : (ok?"":`<button class="btn ghost" data-act="retry">Try again</button>`))
        : `<button class="btn" data-act="check" ${any()?"":"disabled"}>Submit</button>`}</div>`;
    el.querySelectorAll(".choice").forEach(c=>c.onclick=()=>{ const i=+c.dataset.i; if(b.multi){ pick.has(i)?pick.delete(i):pick.add(i); } else pick=i; draw(); });
    const btn = el.querySelector("[data-act]");
    if(btn) btn.onclick = () => {
      if(btn.dataset.act==="check"){
        checked=true;
        ok = b.multi ? b.answers.every((x,i)=>x.c===pick.has(i)) : b.answers[pick].c;
        if(opts.onAnswer) opts.onAnswer(ok); draw();
      }
      else if(btn.dataset.act==="retry"){ checked=false; pick=b.multi?new Set():null; draw(); }
      else opts.onNext();
    };
  };
  draw();
}
function mountProcess(el, b){
  let i = 0; const n = b.steps.length, stepsOnly = b.steps.filter(s=>s.k==="step").length;
  const draw = () => {
    const s = b.steps[i]; const stepNo = b.steps.slice(0,i+1).filter(x=>x.k==="step").length;
    el.innerHTML = `<div class="proc-top"><div class="proc-dots" aria-hidden="true">${b.steps.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div><div class="proc-step">${s.k==="step"?`Step ${stepNo} of ${stepsOnly}`:(s.k==="intro"?"Overview":"Summary")}</div></div>
      <div class="proc-body"><h3>${esc(s.h)}</h3><div class="prose">${s.p}</div></div>
      <div class="btnrow">${i>0?`<button class="btn ghost" data-d="-1">Back</button>`:""}${i<n-1?`<button class="btn" data-d="1">${i===0?"Start":"Next"}</button>`:`<button class="btn ghost" data-d="restart">Start again</button>`}</div>`;
    el.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>{ i = x.dataset.d==="restart"?0:i+(+x.dataset.d); draw(); });
  };
  draw();
}
function mountSort(el, b){
  let deck, placed, msg, msgCls;
  const reset = () => { deck = shuffle(b.cards); placed = b.piles.map(()=>[]); msg = "Tap the pile where this sentence belongs."; msgCls=""; draw(); };
  const draw = (shake) => {
    const card = deck[0];
    el.innerHTML = `<div class="label">${b.cards.length-deck.length} of ${b.cards.length} sorted</div>
      ${card?`<div class="sort-card${shake?" shake":""}">${esc(card.h)}</div>`:`<div class="fb ok"><b>All sorted</b><div>Every sentence is in the right pile.</div></div>`}
      <div class="sort-msg ${msgCls}" aria-live="polite">${card?esc(msg):""}</div>
      <div class="piles">${b.piles.map((p,i)=>`<button class="pile" data-p="${i}" ${card?"":"disabled"}><b>${esc(p)}</b>${placed[i].map(t=>`<span class="placed">${esc(t)}</span>`).join("")}</button>`).join("")}</div>
      ${card?"":`<div class="btnrow"><button class="btn ghost" data-r="1">Start again</button></div>`}`;
    el.querySelectorAll(".pile").forEach(x=>x.onclick=()=>{
      const p=+x.dataset.p;
      if(p===card.p){ placed[p].push(card.h); deck.shift(); msg="Correct. Tap the pile for the next sentence."; msgCls="ok"; draw(); }
      else { msg=`Not quite. This isn't ${b.piles[p].toLowerCase()} — try another pile.`; msgCls="no"; draw(true); }
    });
    const r=el.querySelector("[data-r]"); if(r) r.onclick=reset;
  };
  reset();
}
function mountAll(blocks){
  main.querySelectorAll(".act[data-kind]").forEach((el,k)=>{
    const b = blocks.filter(x=>["mc","process","sort","match"].includes(x.t))[k];
    if(b.t==="mc") mountMC(el,b); else if(b.t==="process") mountProcess(el,b); else if(b.t==="match") mountMatch(el,b,{}); else mountSort(el,b);
  });
  main.querySelectorAll(".tabs").forEach(tb=>{
    const tabs=[...tb.querySelectorAll('[role="tab"]')];
    const sel=i=>tabs.forEach((x,k)=>{ x.setAttribute("aria-selected",k===i); x.tabIndex=k===i?0:-1; document.getElementById(x.getAttribute("aria-controls")).hidden=k!==i; });
    tabs.forEach((x,i)=>{ x.onclick=()=>sel(i); x.onkeydown=e=>{ if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ const n=(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length; sel(n); tabs[n].focus(); } }; });
  });
  main.querySelectorAll(".flash").forEach(f=>f.onclick=()=>f.setAttribute("aria-pressed", f.getAttribute("aria-pressed")==="true"?"false":"true"));
}

let Q = null;
function quiz(){
  setBar("Final check", "Quiz");
  const qs = C.quiz.questions;
  const startScreen = () => {
    main.innerHTML = `<div class="col"><div><div class="kick">Final check</div><h1 style="margin-top:6px">Quiz</h1></div>
      <div class="act"><p class="lede" style="font-size:18px">${qs.length} questions on everything in the course. You need ${C.quiz.pass}% to pass, and you can take it as many times as you like.</p>

    else if(q.t==="fitb") mountFITB(el, q, {label:"Question "+(Q.i+1), onAnswer:ok=>Q.res[Q.i]=ok, onNext, last});

      <div class="review">${qs.map((q,i)=>`<div class="rv"><span class="tick ${Q.res[i]?"done":"no"}">${Q.res[i]?"✓":"✕"}</span><p>${esc(strip(q.q))}</p></div>`).join("")}</div>
